// build-plain.gradle —— plain 形态平台（26.1.x / 26.2.x 免混淆）的共享构建入口（Phase 7 收敛：
// 由 settings.gradle 按 per-version gradle.properties 的 loom_plugin 完整值 net.fabricmc.fabric-loom:1.15.1
// 经 ProjectDescriptor.buildFileName 选中，替代逐平台薄包装 build.gradle）。
// 平台差异仍全部由 versions/platform-*/gradle.properties 数据驱动，共通构建逻辑见根 common.gradle。
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.1'
}

apply from: rootProject.file('common.gradle')

assert project.jar_task == 'plain': "plain family 入口被 jar_task=${project.jar_task} 的平台选中（loom_plugin 映射与 jar_task 数据不一致）"
