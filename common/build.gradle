plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// 固定 common 产物名为无版本号，避免 mod_version 升级后 IDE 缓存仍引用旧版本 jar
// 例如 gradle.properties 2.12.0 -> 2.13.0 时，VSCode JDT/Buildship 曾持续指向 common-2.12.0.jar
tasks.named('jar') {
    archiveFileName = 'common.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'common-sources.jar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// common 编译基准与 mc1211 平台对齐：carpet 坐标取自该平台 per-version 配置（Phase 1 前为根属性 mc1211_carpet_version）
def mc1211CarpetVersion = {
    def props = new Properties()
    def propsFile = rootProject.file('versions/platform-mc1211/gradle.properties')
    propsFile.withInputStream { props.load(it) }
    def value = props.getProperty('carpet_version')
    if (value == null) {
        throw new GradleException("缺少 carpet_version：${propsFile}")
    }
    return value
}()

dependencies {
    compileOnly "carpet:fabric-carpet:${mc1211CarpetVersion}"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
