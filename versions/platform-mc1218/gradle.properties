# platform-mc1218 per-version 配置（Phase 1 迁移；Phase 4 P4-2 切换 Mojmap：yarn_mappings 删除，shared_tiers 指向 mojmap 档）
# minecraft_version / release_minecraft_range / minecraft_dependency /
# fabric_version / fabric_dependency / carpet_version / carpet_dependency
#   逐字迁自根 gradle.properties 的 mc1218_* 键
# loader_version 取自原全局 loader_version
# carpet_repo / loom_plugin / jar_task / java_release 迁自本平台原 build.gradle 依赖与插件声明
# pack_format 迁自根 build.gradle craftableCoralPackFormats[':versions:platform-mc1218']
# mixin_config 登记自本平台 src/main/resources 的 mixin 配置文件名（Phase 1 仅登记，不参与生成）
# shared_tiers / extra_resource_dirs 逐字迁自本平台原 build.gradle sourceSets 的 srcDir 顺序

minecraft_version=1.21.8
release_minecraft_range=1.21.7~1.21.8
minecraft_dependency=>=1.21.7 <=1.21.8
loader_version=0.18.4
fabric_version=0.133.4+1.21.8
fabric_dependency=0.129.0+1.21.7
carpet_version=1.21.7-1.4.177+v250630
carpet_dependency=1.4.177
carpet_repo=masa
loom_plugin=fabric-loom:1.13.6
jar_task=remap
java_release=21
pack_format=81
mixin_config=carpet-ice-addition-mc1218.mixins.json
shared_tiers=
extra_resource_dirs=mc1213-12111

# Phase 5（P5-3）：preprocess flip——根 src + 版本图接管，档位引用撤销（文件保留 dormant 至 P5-7）
preprocess_enabled=true
