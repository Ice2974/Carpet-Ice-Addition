# platform-mc12111 per-version 配置（Phase 1 迁移；Phase 4 P4-2 切换 Mojmap：yarn_mappings 删除，shared_tiers 指向 mojmap 档；1.21.11 的 24 个 Mojmap 名漂移文件入 mojmap-mc12111）
# minecraft_version / release_minecraft_range / minecraft_dependency /
# fabric_version / fabric_dependency / carpet_version / carpet_dependency
#   逐字迁自根 gradle.properties 的 mc12111_* 键
# loader_version 取自原全局 loader_version
# carpet_repo / loom_plugin / jar_task / java_release 迁自本平台原 build.gradle 依赖与插件声明
# pack_format 迁自根 build.gradle craftableCoralPackFormats[':versions:platform-mc12111']
# mixin_config 登记自本平台 src/main/resources 的 mixin 配置文件名（Phase 1 仅登记，不参与生成）
# shared_tiers / extra_resource_dirs 逐字迁自本平台原 build.gradle sourceSets 的 srcDir 顺序

minecraft_version=1.21.11
