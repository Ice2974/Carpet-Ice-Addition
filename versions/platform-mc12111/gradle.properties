fabric_dependency=0.140.2+1.21.11
carpet_version=1.4.194
carpet_dependency=1.4.194
carpet_repo=modrinth
loom_plugin=fabric-loom:1.13.6
jar_task=remap
java_release=21
pack_format=94
mixin_config=carpet-ice-addition-mc12111.mixins.json
shared_tiers=mojmap-mc121x,mojmap-mc1219-12111,mojmap-mc1213-12111,mojmap-mc1215-12111,mojmap-mc1216-12111,mojmap-mc12111
