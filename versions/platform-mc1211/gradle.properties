fabric_version=0.102.1+1.21.1
fabric_dependency=0.102.0+1.21
carpet_version=1.21-1.4.147+v240613
carpet_dependency=1.4.147
carpet_repo=masa
loom_plugin=fabric-loom:1.13.6
jar_task=remap
java_release=21
pack_format=48
mixin_config=carpet-ice-addition-mc1211.mixins.json
shared_tiers=mc121x,mc1211-12110,mc121x-killitem,mc1211-1218,mc1211-1215,mc1211-1214
