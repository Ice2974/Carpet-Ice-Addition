# platform-mc262 per-version 配置（Phase 1 迁移）
# minecraft_version / release_minecraft_range / minecraft_dependency / fabric_version /
# fabric_dependency / carpet_version / carpet_dependency
#   逐字迁自根 gradle.properties 的 mc262_* 键
# loader_version 逐字迁自根 gradle.properties 的 mc262_loader_version
# carpet_repo / loom_plugin / jar_task / java_release / java_toolchain 迁自本平台原 build.gradle 依赖与插件声明
#   （26.x 免混淆形态：无 yarn_mappings，loom 插件为 net.fabricmc.fabric-loom，产物经 jar/sourcesJar 命名）
# pack_format 迁自根 build.gradle craftableCoralPackFormats[':versions:platform-mc262']
# mixin_config 登记自本平台 src/main/resources 的 mixin 配置文件名（Phase 1 仅登记，不参与生成）
# shared_tiers 逐字迁自本平台原 build.gradle sourceSets 的 srcDir 顺序

minecraft_version=26.2
release_minecraft_range=26.2
minecraft_dependency=>=26.2 <=26.2
loader_version=0.19.3
fabric_version=0.154.0+26.2
fabric_dependency=0.154.0+26.2
carpet_version=26.2
carpet_dependency=26.2
carpet_repo=modrinth
loom_plugin=net.fabricmc.fabric-loom:1.15.1
jar_task=plain
java_release=25
java_toolchain=25
pack_format=107
mixin_config=carpet-ice-addition-mc262.mixins.json
shared_tiers=mc26x
