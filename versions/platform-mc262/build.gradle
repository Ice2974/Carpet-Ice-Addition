plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.1'
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-mc262"
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc262_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.mc262_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc262_fabric_version}"
    implementation "maven.modrinth:carpet:${project.mc262_carpet_version}"
}

sourceSets {
    main {
        resources {
            srcDir project(':common').file('src/main/resources')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', project.mc262_release_minecraft_range
    inputs.property 'minecraft_dependency', project.mc262_minecraft_dependency
    inputs.property 'fabric_version', project.mc262_fabric_version
    inputs.property 'fabric_dependency', project.mc262_fabric_dependency
    inputs.property 'carpet_version', project.mc262_carpet_version
    inputs.property 'carpet_dependency', project.mc262_carpet_dependency

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                id: project.mod_id,
                name: project.mod_name,
                minecraft_range: project.mc262_release_minecraft_range,
                minecraft_dependency: project.mc262_minecraft_dependency,
                fabric_version: project.mc262_fabric_version,
                fabric_dependency: project.mc262_fabric_dependency,
                carpet_version: project.mc262_carpet_version,
                carpet_dependency: project.mc262_carpet_dependency
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('jar') {
    from(project(':common').sourceSets.main.output.classesDirs)
}

def releaseMinecraftRange = project.mc262_release_minecraft_range.toString().trim()
def compareMcVersions = { String left, String right ->
    def leftParts = left.tokenize('.').collect { part -> part.toInteger() }
    def rightParts = right.tokenize('.').collect { part -> part.toInteger() }
    def maxLength = Math.max(leftParts.size(), rightParts.size())
    for (int i = 0; i < maxLength; i++) {
        def leftValue = i < leftParts.size() ? leftParts[i] : 0
        def rightValue = i < rightParts.size() ? rightParts[i] : 0
        if (leftValue != rightValue) {
            return leftValue <=> rightValue
        }
    }
    return 0
}
def toVersionParts = { String version ->
    version.tokenize('.').collect { part -> part.toInteger() }
}
def toPatchValue = { List<Integer> parts ->
    parts.size() >= 3 ? parts[2] : 0
}
def releaseRangeParts = releaseMinecraftRange.split(/\s*[~-]\s*/).toList().findAll { !it.isBlank() }
def sortedRangeParts = releaseRangeParts.sort { a, b -> compareMcVersions(a, b) }
def releaseMinecraftLabel
if (sortedRangeParts.size() <= 1) {
    releaseMinecraftLabel = releaseMinecraftRange
} else {
    def lower = sortedRangeParts.first()
    def upper = sortedRangeParts.last()
    def lowerParts = toVersionParts(lower)
    def upperParts = toVersionParts(upper)
    def sameMajorMinor = (
            lowerParts.size() >= 2
            && upperParts.size() >= 2
            && lowerParts[0] == upperParts[0]
            && lowerParts[1] == upperParts[1]
    )
    def patchSpan = Math.abs(toPatchValue(upperParts) - toPatchValue(lowerParts))

    if (sameMajorMinor && patchSpan >= 2) {
        releaseMinecraftLabel = "${lowerParts[0]}.${lowerParts[1]}.x"
    } else {
        releaseMinecraftLabel = "${lower}-${upper}"
    }
}
def releaseJarBaseName = "Carpet-Ice-Addition-v${project.version}-mc${releaseMinecraftLabel}"

tasks.named('jar') {
    archiveFileName = "${releaseJarBaseName}.jar"
}

tasks.named('sourcesJar') {
    archiveFileName = "${releaseJarBaseName}-sources.jar"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}


