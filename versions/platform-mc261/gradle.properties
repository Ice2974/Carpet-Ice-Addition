# platform-mc261 per-version 配置（Phase 1 迁移）
# minecraft_version / release_minecraft_range / minecraft_dependency / fabric_version /
# fabric_dependency / carpet_version / carpet_dependency
#   逐字迁自根 gradle.properties 的 mc261_* 键
# loader_version 逐字迁自根 gradle.properties 的 mc261_loader_version
# carpet_repo / loom_plugin / jar_task / java_release / java_toolchain 迁自本平台原 build.gradle 依赖与插件声明
#   （26.x 免混淆形态：无 yarn_mappings，loom 插件为 net.fabricmc.fabric-loom，产物经 jar/sourcesJar 命名）
# pack_format 迁自根 build.gradle craftableCoralPackFormats[':versions:platform-mc261']
# mixin_config 登记自本平台 src/main/resources 的 mixin 配置文件名（Phase 1 仅登记，不参与生成）
# Phase 5（P5-7）：shared_tiers 键与 Java 档位机制已随 preprocess 体系收敛移除；源码组织见根 build.gradle 版本图与 docs/refactor-phase5-verification.md

