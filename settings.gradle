import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        // com.replaymod.preprocess 经 JitPack 解析到 Fallen-Breath/preprocessor（commit 全 SHA 锁定，见根 gradle.properties）
        maven { url = 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') {
                useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
            }
        }
    }
}

rootProject.name = 'carpet-ice-addition'

// 版本注册表：支持的平台清单的唯一来源。条目 = 平台目录名 = 真实 Minecraft 版本号
// （Gradle 9.2.1 允许中间点项目名，NameValidator 仅禁首尾点与 / \ : < > " ? * |）
def versionRegistryFile = file('settings.json')
def versionRegistry = new JsonSlurper().parse(versionRegistryFile).versions as List<String>

// 注册表与磁盘目录一致性断言（双向 fail closed），防止新增/删除平台目录后忘记更新注册表（或反之）：
//   - versions/ 下的目录集合必须恰为注册表条目目录（无 shared 等附加目录）——多余目录与缺失目录都会失败；
//   - 注册表条目（实际版本号，如 1.21.1 / 26.2）必须各对应 versions/<条目> 目录。
// 注意：注册表声明顺序为版本升序语义序，不是字符串字典序（'1.21.10' < '1.21.9'）；
// 断言对两侧各自排序后比较；include 顺序跟随注册表声明顺序
assert !versionRegistry.isEmpty(): 'settings.json versions 不能为空'
// 注册表重复项在 Settings 阶段显式 fail fast——下方目录一致性比较经 Set 化会静默去重，
// 重复条目不能依赖后续阶段兜底；错误信息直接列出重复的具体条目
def duplicateVersions = versionRegistry.groupBy { it }.findAll { it.value.size() > 1 }.keySet()
assert duplicateVersions.isEmpty():
        "settings.json 版本注册表存在重复项：${duplicateVersions.sort()}"
// versions/ 目录集合恰为注册表条目（双向 fail closed）
def expectedDirNames = versionRegistry.collect { it.toString() } as Set
def versionsDir = file('versions')
assert versionsDir.isDirectory(): "缺少 versions 目录: ${versionsDir}"
// 不用 FilenameFilter 闭包 SAM 转换（IDE 导入的 Gradle/Groovy 环境求值差异来源），无歧义地在 Groovy 侧过滤目录
def diskDirNames = versionsDir.listFiles().findAll { it.isDirectory() }*.name as Set
assert diskDirNames == expectedDirNames:
        "versions/ 目录集合与注册表不一致：disk=${(diskDirNames as List).sort()} expected=${(expectedDirNames as List).sort()}"

// common.gradle 对根资源目录按 rootProject 物理路径接入各平台资源 srcDirs。

// 统一构建入口：全部平台项目的 buildFileName 直接指向根 common.gradle，
// 由其在脚本顶部按 per-version gradle.properties 的 loom_plugin 完整值动态应用对应 Loom 插件。
// per-version gradle.properties 是平台构建数据唯一来源（不另设 family 注册表）；
// Settings 阶段读不到子项目目录的 gradle.properties 普通属性，必须显式解析该文件取
// loom_plugin（缺文件 / 缺键 / 重复键 / 解析异常一律 fail closed），用于：
//   1) 汇总全部平台使用的 loom 插件坐标集合；
//   2) 与根 build.gradle plugins 块实际声明的 loom 坐标做双向全等防漂移（见文末扫描器）。

def readPlatformLoomPlugin = { File propsFile ->
    assert propsFile.isFile(): "缺少平台构建数据文件: ${propsFile}"
    def seenKeys = [] as Set
    String loomPlugin = null
    propsFile.withReader('ISO-8859-1') { reader ->
        reader.eachLine { rawLine, lineNo ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#') || line.startsWith('!')) {
                return
            }
            def sep = line.indexOf('=')
            assert sep > 0: "${propsFile.name} 第 ${lineNo} 行缺少 '=' 键值分隔: ${rawLine}"
            def key = line.substring(0, sep).trim()
            assert key && !seenKeys.contains(key): "${propsFile.name} 第 ${lineNo} 行键为空或重复: ${key}"
            seenKeys << key
            if (key == 'loom_plugin') {
                loomPlugin = line.substring(sep + 1).trim()
            }
        }
    }
    assert loomPlugin: "${propsFile} 缺少必需键 loom_plugin"
    return loomPlugin
}

// 平台为根直接子项目 :<版本>（磁盘目录 versions/<版本>/，
// build 目录跟随 projectDir 不变）；preprocess 插件经 project.parent 取根项目的版本图扩展，
// 嵌套路径 :versions:<版本> 的 parent 是 :versions，不兼容根 src 模型。
def usedLoomCoordinates = [] as Set
versionRegistry.each { version ->
    include ":${version}"
    def platformDir = file("versions/${version}")
    project(":${version}").projectDir = platformDir
    usedLoomCoordinates << readPlatformLoomPlugin(new File(platformDir, 'gradle.properties'))
    // buildFileName 按 ProjectDescriptor 语义相对 projectDir 解析（versions/<版本>/ -> 仓库根）
    project(":${version}").buildFileName = "../../common.gradle"
}
assert file('common.gradle').isFile(): "共享构建入口不存在: ${file('common.gradle')}"

// 根 build.gradle loom 声明防漂移 —— 限定语法扫描器（fail closed，承接原 family 入口坐标静态解析）。
// 规则：
//   1) 结构识别用「有效文本」：逐字符状态机把行/块注释与单双三引号字符串（含 ${...} GString 插值）
//      的内容以空格消除（保留长度与换行），顶层 plugins 块的花括号配对只在有效文本上进行；
//      跨行普通字符串、GString 插值内引号、未闭合注释/字符串等无法归类的结构直接断言失败
//      （不支持语法即拒绝，不静默跳过）；
//   2) 块内 loom 家族声明只接受整行字面形态 id '<id>' version '<版本>' apply false
//      （GString / 双引号版本 / 行尾注释 / 缺 apply false / 重复声明一律拒绝）；接受前按
//      有效文本复核声明结构与词法状态——行首处于块注释/三引号字符串内的行、有效文本中
//      不存在对应代码骨架的行（跨行注释/字符串整体包住的"伪声明"）不得被接受；
//   3) 顶层深度复核：plugins 块起始行必须位于有效代码花括号深度 0（嵌套块不被视为根
//      插件块）；loom 声明必须直接位于该块内（行首深度恰为 1），嵌套子块内的声明拒绝；
//   4) 全文件规则：loom 家族 id 的每一处出现都必须位于某条已接受的声明行内——
//      整块注释声明、字符串内伪声明、块外声明、嵌套声明、形态不符均 fail closed；
//   5) 已接受坐标集合与上方全部平台 loom_plugin 去重集合双向全等
//      （多声明 / 漏声明 / 版本漂移均失败）。
def LOOM_PLUGIN_FAMILY_IDS = ['net.fabricmc.fabric-loom-remap', 'net.fabricmc.fabric-loom', 'fabric-loom'] as Set
def loomIdTokenPattern = /net\.fabricmc\.fabric-loom-remap|net\.fabricmc\.fabric-loom|(?<![\w.])fabric-loom/
def rootBuildFile = file('build.gradle')
assert rootBuildFile.isFile(): "缺少根构建脚本: ${rootBuildFile}"
def rootRawLines = rootBuildFile.readLines('UTF-8')

// 有效文本逐行产出；scanState 跨行保持（blockComment / tsq / tdq）；
// lineStartStates 记录每行行首词法状态，供声明行复核（区分有效代码与注释/字符串区域）
def effectiveLines = []
def lineStartStates = []
def scanState = 'code'
rootRawLines.eachWithIndex { rawLine, lineIdx ->
    lineStartStates << scanState
    StringBuilder out = new StringBuilder(rawLine.length())
    int i = 0
    int n = rawLine.length()
    while (i < n) {
        String ch = rawLine.substring(i, i + 1)
        String nx = i + 1 < n ? rawLine.substring(i + 1, i + 2) : ''
        if (scanState == 'blockComment') {
            if (ch == '*' && nx == '/') { scanState = 'code'; out.append('  '); i += 2 }
            else { out.append(ch == '\t' ? '\t' : ' '); i += 1 }
        } else if (scanState == 'tsq' || scanState == 'tdq') {
            String fence = scanState == 'tsq' ? "'''" : '"""'
            if (rawLine.startsWith(fence, i)) { scanState = 'code'; out.append(fence); i += 3 }
            else { out.append(ch == '\t' ? '\t' : ' '); i += 1 }
        } else if (ch == '/' && nx == '/') {
            break
        } else if (ch == '/' && nx == '*') {
            scanState = 'blockComment'; out.append('  '); i += 2
        } else if (rawLine.startsWith("'''", i)) { scanState = 'tsq'; out.append("'''"); i += 3 }
        else if (rawLine.startsWith('"""', i)) { scanState = 'tdq'; out.append('"""'); i += 3 }
        else if (ch == "'") {
            out.append("'"); i += 1
            boolean closed = false
            while (i < n) {
                String d = rawLine.substring(i, i + 1)
                if (d == '\\') { out.append('  '); i += 2 }
                else if (d == "'") { out.append("'"); i += 1; closed = true; break }
                else { out.append(d == '\t' ? '\t' : ' '); i += 1 }
            }
            assert closed: "根 build.gradle 第 ${lineIdx + 1} 行存在跨行单引号字符串（不支持语法，fail closed）"
        } else if (ch == '"') {
            out.append('"'); i += 1
            boolean closed = false
            while (i < n) {
                String d = rawLine.substring(i, i + 1)
                if (d == '\\') { out.append('  '); i += 2 }
                else if (d == '$' && i + 1 < n && rawLine.substring(i + 1, i + 2) == '{') {
                    out.append('  '); i += 2
                    int depth = 1
                    boolean interpClosed = false
                    while (i < n && depth > 0) {
                        String e = rawLine.substring(i, i + 1)
                        if (e == '{') { depth += 1; out.append(' '); i += 1 }
                        else if (e == '}') { depth -= 1; out.append(' '); i += 1; if (depth == 0) interpClosed = true }
                        else {
                            assert !(e == '"' || e == "'"):
                                    "根 build.gradle 第 ${lineIdx + 1} 行 GString 插值包含引号（不支持语法，fail closed）"
                            out.append(e == '\t' ? '\t' : ' '); i += 1
                        }
                    }
                    assert interpClosed: "根 build.gradle 第 ${lineIdx + 1} 行 GString 插值跨行（不支持语法，fail closed）"
                }
                else if (d == '"') { out.append('"'); i += 1; closed = true; break }
                else { out.append(d == '\t' ? '\t' : ' '); i += 1 }
            }
            assert closed: "根 build.gradle 第 ${lineIdx + 1} 行存在跨行双引号字符串（不支持语法，fail closed）"
        } else {
            out.append(ch); i += 1
        }
    }
    effectiveLines << out.toString()
}
assert scanState == 'code': '根 build.gradle 存在未闭合的块注释或三引号字符串（不支持语法，fail closed）'

// 有效文本逐行行首花括号深度（顶层 plugins 块要求起始行行首深度为 0；
// 块内直接声明要求行首深度恰为 1，嵌套子块内的声明不被接受）
def lineStartDepths = []
int runningDepth = 0
effectiveLines.each { line ->
    lineStartDepths << runningDepth
    line.each { ch ->
        if (ch == '{') { runningDepth += 1 }
        else if (ch == '}') { runningDepth -= 1 }
    }
}

// 顶层 plugins 块定位（固定起始行形态 "plugins {" 且行首有效代码深度为 0；
// 有效文本中字符串/注释的花括号已被消除，嵌套块不构成根插件块）
int pluginsLine = -1
effectiveLines.eachWithIndex { line, idx ->
    if (pluginsLine < 0 && line.trim() == 'plugins {' && lineStartDepths[idx] == 0) { pluginsLine = idx }
}
assert pluginsLine >= 0: '根 build.gradle 缺少位于有效代码顶层的 plugins 块起始行（限定形态 "plugins {" 且行首花括号深度为 0）'
assert effectiveLines.findAll { it.trim() == 'plugins {' }.size() == 1:
        '根 build.gradle 必须恰好有一个 plugins 块起始行（限定语法，fail closed）'
int braceDepth = 0
int blockEndLine = -1
for (int idx = pluginsLine; idx < effectiveLines.size() && blockEndLine < 0; idx++) {
    int lineLen = effectiveLines[idx].length()
    for (int k = 0; k < lineLen; k++) {
        String ch = effectiveLines[idx].substring(k, k + 1)
        if (ch == '{') { braceDepth += 1 }
        else if (ch == '}') {
            braceDepth -= 1
            if (braceDepth == 0) { blockEndLine = idx; break }
        }
    }
}
assert blockEndLine >= 0: '根 build.gradle plugins 块未闭合（有效文本花括号配对失败）'

// 块内 loom 家族声明：按原始行整行匹配（声明中的 id/版本是单引号字面量），
// 并以三重复核排除非代码区域 / 嵌套区域的伪声明（fail closed）：
//   a) 行首词法状态必须为 code（处于块注释 / 三引号字符串内的行不可作为声明）；
//   b) 有效文本中必须存在对应代码骨架（字符串内容已消除，仅剩 id '<空>' version '<空>'
//      apply false 形态；被跨行注释/三引号字符串整体包住的声明行其有效文本全为空白）；
//   c) 行首有效代码花括号深度必须恰为 1（直接位于顶层 plugins 块内，嵌套子块拒绝）。
def acceptedCoordinateByLine = [:]
def rootDeclarationPattern = /^\s*id\s+'([^']+)'\s+version\s+'([^']+)'\s+apply\s+false\s*$/
def effectiveDeclarationPattern = /^[ \t]*id[ \t]+'[ \t]*'[ \t]*version[ \t]+'[ \t]*'[ \t]*apply[ \t]+false[ \t]*$/
rootRawLines.eachWithIndex { rawLine, idx ->
    if (idx < pluginsLine || idx > blockEndLine) return
    if (lineStartStates[idx] != 'code') return
    if (lineStartDepths[idx] != 1) return
    if (!(effectiveLines[idx] =~ effectiveDeclarationPattern).matches()) return
    def matcher = rawLine =~ rootDeclarationPattern
    if (matcher.matches()) {
        def pluginId = matcher.group(1)
        if (pluginId in LOOM_PLUGIN_FAMILY_IDS) {
            acceptedCoordinateByLine[idx] = "${pluginId}:${matcher.group(2)}".toString()
        }
    }
}
def acceptedCoordinates = acceptedCoordinateByLine.values() as List
def duplicateAccepted = acceptedCoordinates.groupBy { it }.findAll { it.value.size() > 1 }.keySet()
assert duplicateAccepted.isEmpty(): "根 build.gradle plugins 块存在重复 loom 声明: ${duplicateAccepted.sort()}"

// 全文件规则：loom 家族 id 的每一处出现必须位于某条已接受声明行内
rootRawLines.eachWithIndex { rawLine, idx ->
    def matcher = rawLine =~ loomIdTokenPattern
    while (matcher.find()) {
        assert acceptedCoordinateByLine.containsKey(idx):
                "根 build.gradle 第 ${idx + 1} 行出现 loom 家族 id（${matcher.group()}），但该行不是顶层 plugins 块内已接受的字面声明（注释/字符串/嵌套或块外/形态不符均 fail closed）: ${rawLine.trim()}"
    }
}

// 双向全等：根声明坐标集合 == 全部平台 loom_plugin 使用坐标集合
def declaredLoomCoordinates = acceptedCoordinates as Set
assert declaredLoomCoordinates == usedLoomCoordinates:
        "根 build.gradle plugins 块 loom 坐标声明与平台 loom_plugin 使用集合不一致：" +
        "declared=${declaredLoomCoordinates.sort()} used=${usedLoomCoordinates.sort()}（多声明/漏声明/版本漂移均 fail closed）"
