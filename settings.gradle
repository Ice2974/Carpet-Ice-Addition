import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        // Phase 5：com.replaymod.preprocess 经 JitPack 解析到 Fallen-Breath/preprocessor（commit 全 SHA 锁定，见根 gradle.properties）
        maven { url = 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') {
                useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
            }
        }
    }
}

rootProject.name = 'carpet-ice-addition'

// 版本注册表：支持的平台清单的唯一来源。条目 = 平台目录名 = 真实 Minecraft 版本号
// （Phase 8 正名；Gradle 9.2.1 允许中间点项目名，NameValidator 仅禁首尾点与 / \ : < > " ? * |）
def versionRegistryFile = file('settings.json')
def versionRegistry = new JsonSlurper().parse(versionRegistryFile).versions as List<String>

// 注册表与磁盘目录一致性断言（双向 fail closed），防止新增/删除平台目录后忘记更新注册表（或反之）：
//   - versions/ 下的目录集合必须恰为「注册表条目目录 ∪ {shared 资源档}」——多余目录与缺失目录都会失败；
//   - 注册表条目（实际版本号，如 1.21.1 / 26.2）必须各对应 versions/<条目> 目录。
// 注意：注册表声明顺序为版本升序语义序，不是字符串字典序（'1.21.10' < '1.21.9'）；
// 断言对两侧各自排序后比较；include 顺序跟随注册表声明顺序
assert !versionRegistry.isEmpty(): 'settings.json versions 不能为空'
def expectedDirNames = (versionRegistry.collect { it.toString() } + ['shared']) as Set
def diskDirNames = file('versions')
        .listFiles({ File parent, String name -> new File(parent, name).isDirectory() } as FilenameFilter)
        .collect { it.name } as Set
assert diskDirNames == expectedDirNames:
        "versions/ 目录集合与注册表不一致：disk=${(diskDirNames as List).sort()} expected=${(expectedDirNames as List).sort()}"

include 'common'

// Phase 7（P7-B）：共享 family 构建入口选择。per-version gradle.properties 仍是平台构建数据唯一来源
// （不新建第二套 family 注册表）；Settings 阶段读不到子项目目录的 gradle.properties 普通属性，
// 必须显式解析该文件取 loom_plugin，并按完整 id:version 精确匹配选择入口
// （缺文件 / 缺键 / 重复键 / 解析异常 / 未知值一律 fail closed）：
//   fabric-loom:1.13.6              -> build-remap.gradle（remap 形态 1.21.x，remapJar/remapSourcesJar）
//   net.fabricmc.fabric-loom:1.15.1 -> build-plain.gradle（plain 形态 26.x，jar/sourcesJar）
def familyBuildEntry = [
        'fabric-loom:1.13.6'             : 'build-remap.gradle',
        'net.fabricmc.fabric-loom:1.15.1': 'build-plain.gradle',
]

def readPlatformLoomPlugin = { File propsFile ->
    assert propsFile.isFile(): "缺少平台构建数据文件: ${propsFile}"
    def seenKeys = [] as Set
    String loomPlugin = null
    propsFile.withReader('ISO-8859-1') { reader ->
        reader.eachLine { rawLine, lineNo ->
            def line = rawLine.trim()
            if (line.isEmpty() || line.startsWith('#') || line.startsWith('!')) {
                return
            }
            def sep = line.indexOf('=')
            assert sep > 0: "${propsFile.name} 第 ${lineNo} 行缺少 '=' 键值分隔: ${rawLine}"
            def key = line.substring(0, sep).trim()
            assert key && !seenKeys.contains(key): "${propsFile.name} 第 ${lineNo} 行键为空或重复: ${key}"
            seenKeys << key
            if (key == 'loom_plugin') {
                loomPlugin = line.substring(sep + 1).trim()
            }
        }
    }
    assert loomPlugin: "${propsFile} 缺少必需键 loom_plugin"
    return loomPlugin
}

// Phase 5（P5-1）：平台为根直接子项目 :<版本>（磁盘目录 versions/<版本>/，
// build 目录跟随 projectDir 不变）；preprocess 插件经 project.parent 取根项目的版本图扩展，
// 嵌套路径 :versions:<版本> 的 parent 是 :versions，不兼容根 src 模型。
versionRegistry.each { version ->
    include ":${version}"
    def platformDir = file("versions/${version}")
    project(":${version}").projectDir = platformDir

    def loomPlugin = readPlatformLoomPlugin(new File(platformDir, 'gradle.properties'))
    def buildEntry = familyBuildEntry[loomPlugin]
    assert buildEntry != null: "versions/${version}/gradle.properties loom_plugin=${loomPlugin} 不在允许的 family 清单 ${familyBuildEntry.keySet().sort()} 内"
    assert file(buildEntry).isFile(): "共享 family 构建入口不存在: ${file(buildEntry)}"
    // buildFileName 按 ProjectDescriptor 语义相对 projectDir 解析（versions/<版本>/ -> 仓库根）
    project(":${version}").buildFileName = "../../${buildEntry}"
}

// Phase 7（P7-R1）：Loom 完整坐标防漂移——每份 family 入口 plugins 块实际声明的 id:version
// 必须与 familyBuildEntry 映射键逐字一致，与上方「per-version loom_plugin 精确匹配选入口」
// 共同构成 per-version loom_plugin ↔ settings.gradle 映射 ↔ 入口实际声明 的闭环（fail closed）。
// 静态解析自有入口文件的固定格式 plugins 块（解析失败即断言失败），不依赖运行期 PluginDescriptor。
def readFamilyEntryLoomCoordinate = { File entryFile ->
    assert entryFile.isFile(): "共享 family 构建入口不存在: ${entryFile}"
    def text = entryFile.getText('UTF-8')
    def pluginsBlock = text =~ /(?s)\bplugins\s*\{(.*?)\}/
    assert pluginsBlock.find(): "${entryFile.name} 缺少 plugins 块"
    def declarations = []
    def declaration = pluginsBlock.group(1) =~ /(?m)\bid\s+'([^']+)'\s+version\s+'([^']+)'/
    while (declaration.find()) {
        declarations << "${declaration.group(1)}:${declaration.group(2)}"
    }
    assert declarations.size() == 1:
            "${entryFile.name} plugins 块必须恰好声明一个 loom 插件坐标，实际: ${declarations}"
    return declarations[0]
}

familyBuildEntry.each { coordinate, entryName ->
    def declared = readFamilyEntryLoomCoordinate(file(entryName))
    assert declared == coordinate:
            "family 入口 ${entryName} 实际声明 loom 坐标 ${declared}，与映射键 ${coordinate} 不一致（Loom 完整坐标防漂移 fail closed）"
}
