import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        // Phase 5：com.replaymod.preprocess 经 JitPack 解析到 Fallen-Breath/preprocessor（commit 全 SHA 锁定，见根 gradle.properties）
        maven { url = 'https://jitpack.io' }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.replaymod.preprocess') {
                useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
            }
        }
    }
}

rootProject.name = 'carpet-ice-addition'

// 版本注册表：支持的平台清单的唯一来源（条目为 versions/platform-* 目录名去掉 platform- 前缀）
def versionRegistryFile = file('settings.json')
def versionRegistry = new JsonSlurper().parse(versionRegistryFile).versions as List<String>

// 注册表与磁盘目录一致性断言，防止新增/删除平台目录后忘记更新注册表（或反之）
// 注意按字典序比较（mc12110 < mc1219），不要求注册表按字典序书写；include 顺序跟随注册表声明顺序
def diskVersions = file('versions')
        .listFiles({ File dir, String name -> dir.isDirectory() && name.startsWith('platform-') } as FilenameFilter)
        .collect { it.name.substring('platform-'.length()) }
        .sort()
assert !versionRegistry.isEmpty(): 'settings.json versions 不能为空'
assert versionRegistry.sort(false) == diskVersions:
        "settings.json versions 与 versions/platform-* 目录不一致：registry=${versionRegistry.sort(false)} disk=${diskVersions}"

include 'common'
// Phase 5（P5-1）：平台为根直接子项目 :platform-mcXXXX（磁盘目录仍在 versions/platform-*/，
// build 目录跟随 projectDir 不变）；preprocess 插件经 project.parent 取根项目的版本图扩展，
// 嵌套路径 :versions:platform-* 的 parent 是 :versions，不兼容根 src 模型。
versionRegistry.each { version ->
    include ":platform-${version}"
    project(":platform-${version}").projectDir = file("versions/platform-${version}")
}
