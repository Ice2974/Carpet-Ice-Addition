allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://masa.dy.fi/maven' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }
}

// 平台清单来自版本注册表 settings.json（与 settings.gradle 同一数据源，消除双源漂移）
def versionRegistry = new groovy.json.JsonSlurper().parse(file('settings.json')).versions as List<String>
def platformProjects = versionRegistry.collect { version -> ":versions:platform-${version}" }

def craftableCoralRecipePaths = [
        'coral_block_from_tube_coral_fan',
        'coral_block_from_brain_coral_fan',
        'coral_block_from_bubble_coral_fan',
        'coral_block_from_fire_coral_fan',
        'coral_block_from_horn_coral_fan',
        'coral_block_from_dead_tube_coral_fan',
        'coral_block_from_dead_brain_coral_fan',
        'coral_block_from_dead_bubble_coral_fan',
        'coral_block_from_dead_fire_coral_fan',
        'coral_block_from_dead_horn_coral_fan'
]

def verifyCraftableCoralBlocksJars = tasks.register('verifyCraftableCoralBlocksJars') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }
            }
            def packRoot = 'resourcepacks/craftable_coral_blocks/'
            def packMeta = "${packRoot}pack.mcmeta"
            def recipeRoot = "${packRoot}data/carpet-ice-addition/recipe/"
            def expectedRecipes = craftableCoralRecipePaths.collect { path -> "${recipeRoot}${path}.json".toString() }

            assert entries.count { name -> name == packMeta } == 1: "Expected one ${packMeta} in ${jarFile.name}"
            assert entries.containsAll(expectedRecipes): "Missing coral recipe in ${jarFile.name}"
            assert entries.findAll { name -> name.startsWith(recipeRoot) && name.endsWith('.json') }.sort() == expectedRecipes.sort():
                    "Unexpected coral recipes in ${jarFile.name}"
            assert entries.every { name -> !name.startsWith('data/carpet-ice-addition/recipe/coral_block_') }:
                    "Legacy main datapack coral recipe remains in ${jarFile.name}"

            def meta = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry(packMeta)
                new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
            }
            // 期望 pack_format 来自各平台 per-version gradle.properties 的 pack_format 键（原硬编码映射的数据化搬移）
            assert meta.pack.pack_format == platform.pack_format.toInteger():
                    "Unexpected pack_format in ${jarFile.name}: ${meta.pack.pack_format}"
        }
    }
}

def verifyFabricModJson = tasks.register('verifyFabricModJson') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def bytes = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("fabric.mod.json entry not found in ${jarFile.name} (${projectPath})")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) starts with a UTF-8 BOM")
            }
            def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
            try {
                new groovy.json.JsonSlurper().parseText(text)
            } catch (Exception e) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) is not valid JSON: ${e.message}", e)
            }
            if (text.contains('${')) {
                throw new GradleException("Unexpanded template placeholder in fabric.mod.json of ${jarFile.name} (${projectPath})")
            }
        }
    }
}

gradle.projectsEvaluated {
    assert platformProjects.toSorted() == gradle.rootProject.allprojects.findAll { it.path.startsWith(':versions:platform-') }*.path.toSorted():
            'platformProjects must stay in sync with the :versions:platform-* projects included by settings.gradle'

    platformProjects.each { projectPath ->
        def platform = project(projectPath)
        def jarTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar')
        verifyCraftableCoralBlocksJars.configure { dependsOn jarTask }
        verifyFabricModJson.configure { dependsOn jarTask }
    }
}
