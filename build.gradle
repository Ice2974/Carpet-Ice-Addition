allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://masa.dy.fi/maven' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }
}

// 平台清单来自版本注册表 settings.json（与 settings.gradle 同一数据源，消除双源漂移）
def versionRegistry = new groovy.json.JsonSlurper().parse(file('settings.json')).versions as List<String>
def platformProjects = versionRegistry.collect { version -> ":versions:platform-${version}" }

def craftableCoralRecipePaths = [
        'coral_block_from_tube_coral_fan',
        'coral_block_from_brain_coral_fan',
        'coral_block_from_bubble_coral_fan',
        'coral_block_from_fire_coral_fan',
        'coral_block_from_horn_coral_fan',
        'coral_block_from_dead_tube_coral_fan',
        'coral_block_from_dead_brain_coral_fan',
        'coral_block_from_dead_bubble_coral_fan',
        'coral_block_from_dead_fire_coral_fan',
        'coral_block_from_dead_horn_coral_fan'
]

def verifyCraftableCoralBlocksJars = tasks.register('verifyCraftableCoralBlocksJars') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }
            }
            def packRoot = 'resourcepacks/craftable_coral_blocks/'
            def packMeta = "${packRoot}pack.mcmeta"
            def recipeRoot = "${packRoot}data/carpet-ice-addition/recipe/"
            def expectedRecipes = craftableCoralRecipePaths.collect { path -> "${recipeRoot}${path}.json".toString() }

            assert entries.count { name -> name == packMeta } == 1: "Expected one ${packMeta} in ${jarFile.name}"
            assert entries.containsAll(expectedRecipes): "Missing coral recipe in ${jarFile.name}"
            assert entries.findAll { name -> name.startsWith(recipeRoot) && name.endsWith('.json') }.sort() == expectedRecipes.sort():
                    "Unexpected coral recipes in ${jarFile.name}"
            assert entries.every { name -> !name.startsWith('data/carpet-ice-addition/recipe/coral_block_') }:
                    "Legacy main datapack coral recipe remains in ${jarFile.name}"

            def meta = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry(packMeta)
                new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
            }
            // 期望 pack_format 来自各平台 per-version gradle.properties 的 pack_format 键（原硬编码映射的数据化搬移）
            assert meta.pack.pack_format == platform.pack_format.toInteger():
                    "Unexpected pack_format in ${jarFile.name}: ${meta.pack.pack_format}"
        }
    }
}

def verifyFabricModJson = tasks.register('verifyFabricModJson') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def bytes = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("fabric.mod.json entry not found in ${jarFile.name} (${projectPath})")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) starts with a UTF-8 BOM")
            }
            def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
            try {
                new groovy.json.JsonSlurper().parseText(text)
            } catch (Exception e) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) is not valid JSON: ${e.message}", e)
            }
            if (text.contains('${')) {
                throw new GradleException("Unexpanded template placeholder in fabric.mod.json of ${jarFile.name} (${projectPath})")
            }

            // 项目级一致性防线（Phase 2 新增），锚定 per-version 数据键：
            // 1) fabric.mod.json 的 mixins 引用恰为登记的 mixin_config；
            // 2) 该 mixin 配置文件实际存在于 jar；
            // 3) depends.fabricloader == ">=loader_version"。第 3 条是本项目当前数据模型的
            //    项目级 invariant（模板硬编码值与 per-version loader_version 恒等），
            //    不是 Fabric Loader 的通用必然关系；未来若某平台最低运行依赖需与构建
            //    loader 版本分离，应先调整 per-version 数据模型，再同步放宽此断言。
            def fabricModJson = new groovy.json.JsonSlurper().parseText(text)
            def mixinConfigName = platform.mixin_config
            assert fabricModJson.mixins == [mixinConfigName]:
                    "fabric.mod.json mixins ${fabricModJson.mixins} != [${mixinConfigName}] in ${jarFile.name} (${projectPath})"
            def mixinConfigInJar = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.getEntry(mixinConfigName) != null
            }
            assert mixinConfigInJar: "mixin config ${mixinConfigName} not found in ${jarFile.name} (${projectPath})"
            def expectedLoaderDependency = ">=${platform.loader_version}"
            assert fabricModJson.depends.fabricloader == expectedLoaderDependency:
                    "fabric.mod.json fabricloader ${fabricModJson.depends.fabricloader} != ${expectedLoaderDependency} in ${jarFile.name} (${projectPath})"
        }
    }
}

// L1-6 jar 内容级等价对照（Phase 2）：与 Phase 1 迁移前（0270fc3）的全量构建快照逐平台比对。
// 用法：.\gradlew.bat verifyJarEquivalence -PbaselineDir=<快照根目录>（含 versions/platform-*/build/libs 的目录，建议绝对路径）
// 比对项：zip 条目清单、fabric.mod.json 解析后逐键语义、全部 *.mixins.json 字节、pack.mcmeta 的 pack_format；
// 另核对两侧 sources jar 存在且同名。class 文件不做字节级比对（编译时间戳噪声，见 refactor-target-architecture R5）。
def verifyJarEquivalence = tasks.register('verifyJarEquivalence') {
    doLast {
        def baselineDirName = project.findProperty('baselineDir')
        if (baselineDirName == null) {
            throw new GradleException('缺少 -PbaselineDir=<迁移前全量构建快照根目录>（指向含 versions/platform-*/build/libs 的目录，建议绝对路径）')
        }
        def baselineRoot = rootProject.file(baselineDirName)

        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def currentJar = outputTask.archiveFile.get().asFile
            assert currentJar.isFile(): "Missing release JAR for ${projectPath}: ${currentJar}"

            def platformCode = platform.name.substring('platform-'.length())
            def baselineJar = new File(baselineRoot, "versions/platform-${platformCode}/build/libs/${currentJar.name}")
            assert baselineJar.isFile(): "Baseline JAR not found for ${projectPath}: ${baselineJar}"

            def sourcesName = { String jarName -> "${jarName.substring(0, jarName.length() - 4)}-sources.jar" }
            assert new File(currentJar.parentFile, sourcesName(currentJar.name)).isFile():
                    "Missing current sources JAR for ${projectPath}"
            assert new File(baselineJar.parentFile, sourcesName(baselineJar.name)).isFile():
                    "Baseline sources JAR not found for ${projectPath}"

            def readEntries = { File jarFile ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    zip.entries().collect { entry -> entry.name } as Set<String>
                }
            }
            def currentEntries = readEntries(currentJar)
            def baselineEntries = readEntries(baselineJar)
            def missingEntries = (baselineEntries - currentEntries).sort()
            def extraEntries = (currentEntries - baselineEntries).sort()
            if (missingEntries || extraEntries) {
                throw new GradleException("Zip entry mismatch for ${currentJar.name} vs ${baselineJar.name}:\n" +
                        "  missing in current: ${missingEntries}\n  extra in current: ${extraEntries}")
            }

            def readEntryBytes = { File jarFile, String entryName ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    def entry = zip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("Entry ${entryName} not found in ${jarFile.name}")
                    }
                    zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                }
            }
            def readEntryText = { File jarFile, String entryName ->
                new String(readEntryBytes(jarFile, entryName), java.nio.charset.StandardCharsets.UTF_8)
            }

            // fabric.mod.json：模板展开值应完全相同，解析后逐键语义一致
            def slurper = new groovy.json.JsonSlurper()
            def currentModJson = slurper.parseText(readEntryText(currentJar, 'fabric.mod.json'))
            def baselineModJson = slurper.parseText(readEntryText(baselineJar, 'fabric.mod.json'))
            assert currentModJson == baselineModJson:
                    "fabric.mod.json semantic mismatch for ${currentJar.name} vs ${baselineJar.name}"

            // 全部 mixin 配置文件逐字节一致（其内容不参与模板展开）
            currentEntries.findAll { it.endsWith('.mixins.json') }.sort().each { entryName ->
                assert java.util.Arrays.equals(readEntryBytes(currentJar, entryName), readEntryBytes(baselineJar, entryName)):
                        "mixin config ${entryName} differs between ${currentJar.name} and ${baselineJar.name}"
            }

            // 珊瑚资源包 pack.mcmeta 的 pack_format 逐平台一致
            def packMetaPath = 'resourcepacks/craftable_coral_blocks/pack.mcmeta'
            def currentPackFormat = slurper.parseText(readEntryText(currentJar, packMetaPath)).pack.pack_format
            def baselinePackFormat = slurper.parseText(readEntryText(baselineJar, packMetaPath)).pack.pack_format
            assert currentPackFormat == baselinePackFormat:
                    "pack_format mismatch for ${currentJar.name}: current=${currentPackFormat} baseline=${baselinePackFormat}"

            println "L1-6 equivalence OK: ${currentJar.name}"
        }
    }
}

gradle.projectsEvaluated {
    assert platformProjects.toSorted() == gradle.rootProject.allprojects.findAll { it.path.startsWith(':versions:platform-') }*.path.toSorted():
            'platformProjects must stay in sync with the :versions:platform-* projects included by settings.gradle'

    platformProjects.each { projectPath ->
        def platform = project(projectPath)
        def jarTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar')
        verifyCraftableCoralBlocksJars.configure { dependsOn jarTask }
        verifyFabricModJson.configure { dependsOn jarTask }
        verifyJarEquivalence.configure { dependsOn jarTask }
    }
}
