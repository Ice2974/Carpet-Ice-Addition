plugins {
    // Phase 5（P5-1）：根项目承载 preprocess 版本图（根无 parent → 自动应用 RootPreprocessPlugin）。
    // 插件 id 沿用 ReplayMod 上游命名，经 settings.gradle resolutionStrategy 解析到
    // JitPack com.github.Fallen-Breath:preprocessor（版本 = 根 gradle.properties preprocess_version，全 SHA 锁定）。
    id 'com.replaymod.preprocess' version "${preprocess_version}"
}

// Phase 11 build-only schema/generator support. Canonical data is deliberately outside every runtime resource tree.
apply from: rootProject.file('gradle/mixin-registry.gradle')

// preprocess 版本图（Phase 5；Phase 8 节点正名）：节点名 = 真实 Gradle project name = 真实 MC 版本号
// （扁平化后 :1.21.11 等；P8-0 本地探针已实证 Gradle 9.2.1 接受中间点项目名），
// 版本码整数与节点一一对应（整数驱动 //#if MC 比较，与节点名正交，保持不变）；
// 主版本（core = versions/mainProject 文件内容 1.21.11，即 root src 的命名基准）无变换直通，其余节点沿链变换。
// 边约定：link(高版本侧, 低版本侧, file)，mapping 文件内容 = 高版本侧命名 → 低版本侧命名（AMS 同款约定）；
// 1.21.x remap↔remap 边依赖插件经 loom mappings 的 automatic mapping（named→intermediary→named 自动合成，
// P5-0 实证的纯 rename 不写条目，文件保持 0 字节）；1.21.11↔26.1.2 为 remap↔plain 边
// （26.x 无 intermediary，自动链路不存在），显式 legacy mapping 承载 rename（P5-4 已按机械提取+编译复核
// 定稿：仅 2 条最小 legacy mapping——displayClientMessage→sendSystemMessage、getDayTime→getOverworldClockTime）。
preprocess {
    strictExtraMappings.set(true)

    def v1_21_1  = createNode('1.21.1', 1_21_01, '')
    def v1_21_3  = createNode('1.21.3', 1_21_03, '')
    def v1_21_4  = createNode('1.21.4', 1_21_04, '')
    def v1_21_5  = createNode('1.21.5', 1_21_05, '')
    def v1_21_6  = createNode('1.21.6', 1_21_06, '')
    def v1_21_8  = createNode('1.21.8', 1_21_08, '')
    def v1_21_9  = createNode('1.21.9', 1_21_09, '')
    def v1_21_10 = createNode('1.21.10', 1_21_10, '')
    def v1_21_11 = createNode('1.21.11', 1_21_11, '')
    def v26_1_2  = createNode('26.1.2', 26_01_02, '')
    def v26_2    = createNode('26.2', 26_02_00, '')

    v1_21_3.link(v1_21_1, file('versions/mapping-1.21.3-1.21.1.txt'))
    v1_21_4.link(v1_21_3, file('versions/mapping-1.21.4-1.21.3.txt'))
    v1_21_5.link(v1_21_4, file('versions/mapping-1.21.5-1.21.4.txt'))
    v1_21_6.link(v1_21_5, file('versions/mapping-1.21.6-1.21.5.txt'))
    v1_21_8.link(v1_21_6, file('versions/mapping-1.21.8-1.21.6.txt'))
    v1_21_9.link(v1_21_8, file('versions/mapping-1.21.9-1.21.8.txt'))
    v1_21_10.link(v1_21_9, file('versions/mapping-1.21.10-1.21.9.txt'))
    v1_21_11.link(v1_21_10, file('versions/mapping-1.21.11-1.21.10.txt'))
    v1_21_11.link(v26_1_2, file('versions/mapping-1.21.11-26.1.2.txt'))
    v26_2.link(v26_1_2, file('versions/mapping-26.2-26.1.2.txt'))
}

allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://masa.dy.fi/maven' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }
}

// 平台清单来自版本注册表 settings.json（与 settings.gradle 同一数据源，消除双源漂移）
def versionRegistry = new groovy.json.JsonSlurper().parse(file('settings.json')).versions as List<String>
def platformProjects = versionRegistry.collect { version -> ":${version}" }
def mixinRegistryFile = file('gradle/mixins/registry.json')
ext.mixinRegistryFile = mixinRegistryFile

// P8 正名后的版本项目名登记（common.gradle 的 platform-only 三重断言数据源；根项目先于子项目配置，时序安全）
ext.versionProjectNames = versionRegistry.collect { it.toString() }

// P9：单元测试归属 core 平台。versions/mainProject 文件内容 = 主源码命名基准 = core 版本项目名，
// common.gradle 据此为该项目接线 test sourceSet（其余平台 test 保持 NO-SOURCE）。
// fail closed：内容 trim 后非空，且必须是 settings.json 注册表登记的版本项目。
def mainProjectNameRaw = file('versions/mainProject').getText('UTF-8').trim()
assert !mainProjectNameRaw.isEmpty(): 'versions/mainProject 内容不得为空'
assert mainProjectNameRaw in versionRegistry.collect { it.toString() }:
        "versions/mainProject=${mainProjectNameRaw} 必须是 settings.json 版本注册表登记的版本项目"
ext.mainProjectName = mainProjectNameRaw

