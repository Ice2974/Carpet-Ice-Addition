        ':versions:platform-mc1211',
        ':versions:platform-mc1213',
        ':versions:platform-mc1214',
        ':versions:platform-mc1215',
        ':versions:platform-mc1216',
        ':versions:platform-mc1218',
        ':versions:platform-mc1219',
        ':versions:platform-mc12110',
        ':versions:platform-mc12111',
        ':versions:platform-mc261',
        ':versions:platform-mc262'
]

def craftableCoralRecipePaths = [
        'coral_block_from_tube_coral_fan',
        'coral_block_from_brain_coral_fan',
        'coral_block_from_bubble_coral_fan',
        'coral_block_from_fire_coral_fan',
        'coral_block_from_horn_coral_fan',
        'coral_block_from_dead_tube_coral_fan',
        'coral_block_from_dead_brain_coral_fan',
