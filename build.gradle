// P10-B：资源碰撞不变式预期数据（common.gradle 各平台 afterEvaluate 配置期消费，fail closed）。
// key = 平台项目名，keySet 必须与版本注册表完全一致（common.gradle 有全等断言：
// 未来新增平台缺键不会被默认当作空集放行）；
// value = 该平台允许的「生效资源 srcDirs 相对路径碰撞集合」（相对路径统一以 / 规范化）。
// P10-B（versions/shared / extra_resource_dirs 退出）：10 个 modern 珊瑚配方迁入根 src/main/resources，
// 1.21.1 保留本地 old-schema 同路径覆盖（平台本地层经 EXCLUDE first-wins 胜出），其预期碰撞集合
// 恰为 craftableCoralRecipePaths 派生的 10 条内置资源包 recipe 相对路径（单一来源派生，不维护第二份
// 配方名单）；其余平台无碰撞，预期空集。
ext.expectedRootResourceCollisions =
        versionRegistry.collect { it.toString() }.findAll { it != '1.21.1' }.collectEntries { version ->
            [(version): new LinkedHashSet<String>()]
        } + [('1.21.1'): new LinkedHashSet<String>(
                craftableCoralRecipePaths.collect { recipe ->
                    "${craftableCoralPackRoot}data/carpet-ice-addition/recipe/${recipe}.json".toString()
                })]

def verifyCraftableCoralBlocksJars = tasks.register('verifyCraftableCoralBlocksJars') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }
            }
            def packRoot = craftableCoralPackRoot
            def packMeta = "${packRoot}pack.mcmeta"
            def recipeRoot = "${packRoot}data/carpet-ice-addition/recipe/"
            def expectedRecipes = craftableCoralRecipePaths.collect { path -> "${recipeRoot}${path}.json".toString() }

            assert entries.count { name -> name == packMeta } == 1: "Expected one ${packMeta} in ${jarFile.name}"
            assert entries.containsAll(expectedRecipes): "Missing coral recipe in ${jarFile.name}"
            assert entries.findAll { name -> name.startsWith(recipeRoot) && name.endsWith('.json') }.sort() == expectedRecipes.sort():
                    "Unexpected coral recipes in ${jarFile.name}"
            assert entries.every { name -> !name.startsWith('data/carpet-ice-addition/recipe/coral_block_') }:
                    "Legacy main datapack coral recipe remains in ${jarFile.name}"

            def meta = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry(packMeta)
                new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
            }
            // 期望 pack_format 来自各平台 per-version gradle.properties 的 pack_format 键（原硬编码映射的数据化搬移）
            assert meta.pack.pack_format == platform.pack_format.toInteger():
                    "Unexpected pack_format in ${jarFile.name}: ${meta.pack.pack_format}"
        }
    }
}

def verifyFabricModJson = tasks.register('verifyFabricModJson') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def bytes = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("fabric.mod.json entry not found in ${jarFile.name} (${projectPath})")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) starts with a UTF-8 BOM")
            }
            def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
            try {
                new groovy.json.JsonSlurper().parseText(text)
            } catch (Exception e) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) is not valid JSON: ${e.message}", e)
            }
            if (text.contains('${')) {
                throw new GradleException("Unexpanded template placeholder in fabric.mod.json of ${jarFile.name} (${projectPath})")
            }

            // 项目级一致性防线（Phase 2 新增），锚定 per-version 数据键：
            // 1) fabric.mod.json 的 mixins 引用恰为登记的 mixin_config；
            // 2) 该 mixin 配置文件实际存在于 jar；
            // 3) depends.fabricloader == ">=loader_version"。第 3 条是本项目当前数据模型的
            //    项目级 invariant（模板硬编码值与 per-version loader_version 恒等），
            //    不是 Fabric Loader 的通用必然关系；未来若某平台最低运行依赖需与构建
            //    loader 版本分离，应先调整 per-version 数据模型，再同步放宽此断言。
            def fabricModJson = new groovy.json.JsonSlurper().parseText(text)
            def mixinConfigName = platform.mixin_config
            assert fabricModJson.mixins == [mixinConfigName]:
                    "fabric.mod.json mixins ${fabricModJson.mixins} != [${mixinConfigName}] in ${jarFile.name} (${projectPath})"
            def mixinConfigInJar = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.getEntry(mixinConfigName) != null
            }
            assert mixinConfigInJar: "mixin config ${mixinConfigName} not found in ${jarFile.name} (${projectPath})"
            def expectedLoaderDependency = ">=${platform.loader_version}"
            assert fabricModJson.depends.fabricloader == expectedLoaderDependency:
                    "fabric.mod.json fabricloader ${fabricModJson.depends.fabricloader} != ${expectedLoaderDependency} in ${jarFile.name} (${projectPath})"
        }
    }
}

// Phase 11 Mixin 配置闭环：canonical registry → per-project generated output → runtime/sources JAR
// → runtime Mixin classes → fabric.mod.json。entry 数量与 membership signature 均动态推导，不锁死迁移时统计值。
def verifyMixinConfigs = tasks.register('verifyMixinConfigs') {
    doLast {
        def registeredMcVersions = versionRegistry.collectEntries { version ->
            def platform = project(":${version}")
            assert platform.ext.has('mcVersion'):
                    "平台 ${platform.path} 缺少 preprocess 注入的 project.extra[mcVersion]"
            [(version.toString()): platform.ext.get('mcVersion')]
        }
        def registry = rootProject.ext.mixinRegistrySupport.validateAndExpand(
                mixinRegistryFile, versionRegistry.collect { it.toString() }, registeredMcVersions)

        def canonicalPath = mixinRegistryFile.canonicalFile.toPath()
        def runtimeResourceDirs = [file('src/main/resources')] + versionRegistry.collect {
            file("versions/${it}/src/main/resources")
        }
        runtimeResourceDirs.each { resourceDir ->
            assert !canonicalPath.startsWith(resourceDir.canonicalFile.toPath()):
                    "canonical Mixin registry must be outside runtime resources: ${mixinRegistryFile}"
            def handwritten = resourceDir.isDirectory()
                    ? fileTree(resourceDir) { include '**/*.mixins.json' }.files
                    : []
            assert handwritten.isEmpty():
                    "tracked/source-tree *.mixins.json is forbidden after Phase 11 (${resourceDir}): ${handwritten.sort()}"
        }

        def readZipEntryBytes = { File jarFile, String entryName ->
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("Entry ${entryName} not found in ${jarFile.name}")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
        }
        def zipFileEntries = { File jarFile ->
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().toList().findAll { !it.isDirectory() }*.name
            }
        }

        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing release JAR for ${projectPath}: ${jarFile}"
            def mixinConfigName = platform.mixin_config
            def configLabel = "${jarFile.name} (${projectPath})"
            def generatedFile = platform.ext.generatedMixinConfigFile.get().asFile
            assert generatedFile.isFile(): "generated Mixin config missing for ${projectPath}: ${generatedFile}"
            assert generatedFile.name == mixinConfigName:
                    "generated filename ${generatedFile.name} != mixin_config ${mixinConfigName} (${projectPath})"
            def generatedBytes = generatedFile.bytes
            assert !(generatedBytes.length >= 3 && (generatedBytes[0] & 0xFF) == 0xEF &&
                    (generatedBytes[1] & 0xFF) == 0xBB && (generatedBytes[2] & 0xFF) == 0xBF):
                    "generated Mixin config has UTF-8 BOM: ${generatedFile}"
            def generatedText = new String(generatedBytes, java.nio.charset.StandardCharsets.UTF_8)
            assert !generatedText.contains('\r'): "generated Mixin config must use LF newlines: ${generatedFile}"
            assert !generatedText.contains('${') && !generatedText.contains('{{'):
                    "generated Mixin config contains an unexpanded token: ${generatedFile}"
            def expectedText = rootProject.ext.mixinRegistrySupport.renderEffectiveConfig(
                    registry, platform.name, platform.java_release.toInteger())
            assert generatedText == expectedText:
                    "generated Mixin config differs from canonical expansion: ${generatedFile}"

            def runtimeEntries = zipFileEntries(jarFile)
            def runtimeMixinConfigs = runtimeEntries.findAll { it.endsWith('.mixins.json') }
            assert runtimeMixinConfigs == [mixinConfigName]:
                    "runtime JAR must contain exactly its generated Mixin config (${configLabel}): ${runtimeMixinConfigs.sort()}"
            assert java.util.Arrays.equals(readZipEntryBytes(jarFile, mixinConfigName), generatedBytes):
                    "runtime JAR Mixin config differs from generator output (${configLabel})"

            def sourcesTask = platform.tasks.findByName('remapSourcesJar') ?: platform.tasks.named('sourcesJar').get()
            def sourcesJar = sourcesTask.archiveFile.get().asFile
            assert sourcesJar.isFile(): "Missing sources JAR for ${projectPath}: ${sourcesJar}"
            def sourcesMixinConfigs = zipFileEntries(sourcesJar).findAll { it.endsWith('.mixins.json') }
            assert sourcesMixinConfigs == [mixinConfigName]:
                    "sources JAR must contain exactly its generated Mixin config (${projectPath}): ${sourcesMixinConfigs.sort()}"
            assert java.util.Arrays.equals(readZipEntryBytes(sourcesJar, mixinConfigName), generatedBytes):
                    "sources JAR Mixin config differs from generator output (${projectPath})"

            def config = new groovy.json.JsonSlurper().parseText(generatedText)
            def mixinsList = (config.mixins ?: []) as List<String>
            def clientList = (config.client ?: []) as List<String>
            def allEntries = mixinsList + clientList
            def effective = registry.effectiveByVersion[platform.name]
            assert mixinsList == effective.mixins && clientList == effective.client:
                    "generated membership/order differs from canonical effective config in ${configLabel}"
            assert allEntries.size() == allEntries.toSet().size():
                    "duplicate mixin entries in ${configLabel}"
            assert (mixinsList as Set).intersect(clientList as Set).isEmpty():
                    "entries listed in both mixins and client arrays in ${configLabel}"
            effective.edges.each { edge ->
                def sideList = mixinsList.contains(edge.before) ? mixinsList : clientList
                assert sideList.indexOf(edge.before) >= 0 && sideList.indexOf(edge.before) < sideList.indexOf(edge.after):
                        "effective precedence violated in ${configLabel}: ${edge.before} must be before ${edge.after}"
            }

            def jarEntries = runtimeEntries as Set<String>
            def dangling = allEntries.findAll { name ->
                !jarEntries.contains("com/ice2974/carpeticeaddition/mixins/${name}.class".toString())
            }
            assert dangling.isEmpty(): "dangling mixin entries (no class in jar) in ${configLabel}: ${dangling.sort()}"

            def mixinPkgPath = 'com/ice2974/carpeticeaddition/mixins'
            // P5-1c：反向枚举对象从「源码集 .java 文件」改为「jar 内 mixins 包实际产物 class」
            // （top-level，排除 $ 内部类）。理由：preprocess 整文件 guard 的空输出 .java 会留在
            // 生成目录（全部行为 //$$ 注释，无类型声明、不产 class），按源文件枚举会误报漏注；
            // 以实际编译/发布产物做双向校验不弱于旧口径（旧体系下源文件与产物一一对应，
            // 改造后旧体系 11 平台校验结果与改造前逐平台一致，见 docs/refactor-phase5-verification.md）。
            def compiledMixinClasses = jarEntries.findAll { name ->
                name.startsWith("${mixinPkgPath}/") && name.endsWith('.class') && !name.contains('$')
            }.collect { name ->
                name.substring("${mixinPkgPath}/".length(), name.length() - '.class'.length())
            } as Set
            def unlisted = compiledMixinClasses.findAll { name -> !allEntries.contains(name) }
            assert unlisted.isEmpty(): "mixin classes in source set but missing from ${mixinConfigName} in ${configLabel}: ${unlisted.sort()}"
            assert (allEntries as Set) == compiledMixinClasses:
                    "mixin entry set != runtime Mixin class set in ${configLabel}"

            def fabricMod = new groovy.json.JsonSlurper().parseText(
                    new String(readZipEntryBytes(jarFile, 'fabric.mod.json'), java.nio.charset.StandardCharsets.UTF_8))
            assert fabricMod.mixins == [mixinConfigName]:
                    "fabric.mod.json must reference exactly generated ${mixinConfigName} in ${configLabel}"

            def expectedResourceDirs = [new File(platform.projectDir, 'src/main/resources').canonicalFile,
                                        file('src/main/resources').canonicalFile]
            assert platform.sourceSets.main.resources.srcDirs.collect { it.canonicalFile } == expectedResourceDirs:
                    "resource srcDirs changed for ${projectPath}: ${platform.sourceSets.main.resources.srcDirs}"

            println "mixin config OK: ${configLabel} (${mixinsList.size()} mixins + ${clientList.size()} client; canonical/generated/runtime/classes/fabric.mod closed)"
        }
    }
}

// ==================== Phase 6（P6-1）：class rename 等价验证框架 ====================
// 显式 class rename mapping（versions/class-rename-mapping.txt）是 verifyJarEquivalence 的唯一差异豁免通道：
//   - 每行 `<oldFQCN> -> <newFQCN>`；仅允许项目自有类（com.ice2974.*）整类 rename，禁止链式映射；
//   - per-platform bijective：mapping 应用到某平台 baseline 条目后必须与当前条目一一对应，
//     同平台不得产生映射碰撞；不同平台的互斥历史名允许映射到同一目的地；
//   - 无 wildcard / 字面量豁免：显式 mapping 是运行时 / 编译产物语义差异的唯一允许来源；
//     mapping 之外的方法、字段、常量、字符串字面量、控制流、指令、class 结构及资源内容
//     差异都必须失败并人工分析（fail closed）。channel A 实际参与证明时还会对字符串 /
//     注释等非 code 段逐字符严格比较；纯源码注释变更若不影响 classfile，由 Git diff /
//     提交审查纪律负责，不属于本验证器的强制失败条件。
// 内容级等价证明范围（P6-R2 起）：所有 com/ice2974/**.class 的 baseline→current 对位项
//   （未改名 class 同名对位，已改名 class 按显式 mapping 对位）都必须给出内容级证明，
//   不只覆盖 renamed pair——同时覆盖 FQCN 未变但内部引用了 renamed class 的项目类。
// 证明优先级（三者取一，全部走不通即 fail closed）：
//   0. classfile 字节一致（rename 完全未波及该类时的最强证明）；
//   channel A = sourcesJar 源码规范化等价（baseline 侧按 full mapping 仅在 code 段整词改写类名引用；
//               字符串字面量 / char / text block / 注释逐字符原样比较，任何 literal 或注释差异都不在 A 放行）；
//   channel B = asm classfile 规范化等价（full-mapping Remapper 重映射 internal name（含 $ 内部类前缀传播）+
//               剔除 SourceFile / LineNumberTable 编译期调试元数据后重建字节做严格比较；
//               字符串字面量不被重映射，差异即失败）；
//   sources 缺失（如 $ 内部类、门控空文件被同路径 override 吸收）或 A 不等价时由 B 兜底；
//   B 不可用时 fail closed（不新增依赖、不自建宽松 comparator）。
// 普通 non-class 资源（fabric.mod.json / *.mixins.json 专项语义检查之外）按路径逐条字节级比较；
//   珊瑚资源包 pack.mcmeta 亦参与字节级一致（另有 pack_format 专项 invariant）；
//   rename 不是资源内容差异的豁免理由。
// baseline 快照永久只读：verifyJarEquivalence 只读不写。现行 P6 baseline（P6-baseline-final）为 flat 布局：
//   <快照根>/<legacy 平台目录名>/build/libs（legacy 目录名 = 正名前的 platform-mcXXXX，见上方 legacyBaselineDirNames）；
//   工具同时兼容历史 versions/<legacy 平台目录名>/build/libs 布局。
//   不得为迎合验证器修改 / 重建 P6-baseline-final；若工具链漂移需要同工具链对照，
//   只允许以冻结的 Phase HEAD clean build 建立明确标记的辅助 baseline，禁止从含未验证改动的工作区重建 baseline。
def classRenameMappingFile = rootProject.file('versions/class-rename-mapping.txt')

def loadClassRenameMapping = {
    def mapping = new LinkedHashMap<String, String>()
    if (!classRenameMappingFile.isFile()) {
        return mapping
    }
    classRenameMappingFile.eachLine { line, lineNo ->
        def text = line.trim()
        if (text.isEmpty() || text.startsWith('#')) {
            return
        }
        def parts = text.split(/\s+->\s+/)
        assert parts.size() == 2 && parts[0].trim() && parts[1].trim():
                "class rename mapping 第 ${lineNo} 行格式错误（应为 `<oldFQCN> -> <newFQCN>`）: ${line}"
        def oldFqcn = parts[0].trim()
        def newFqcn = parts[1].trim()
        assert oldFqcn.startsWith('com.ice2974.') && newFqcn.startsWith('com.ice2974.'):
                "class rename mapping 只允许项目自有类（com.ice2974.*）: ${line}"
        assert oldFqcn != newFqcn: "class rename mapping old == new: ${oldFqcn}"
        assert !mapping.containsKey(oldFqcn): "class rename mapping old FQCN 重复: ${oldFqcn}"
        mapping[oldFqcn] = newFqcn
    }
    def oldSimples = mapping.keySet().collect { it.substring(it.lastIndexOf('.') + 1) } as Set
    mapping.each { oldFqcn, newFqcn ->
        def newSimple = newFqcn.substring(newFqcn.lastIndexOf('.') + 1)
        assert !oldSimples.contains(newSimple):
                "class rename mapping 存在链式 / 交叠映射：目的地简名 ${newSimple} 同时是另一行的 old 简名"
    }
    return mapping
}

// ---- Java 源码分段（renamed-pair channel A 的 fail-closed 基础设施）----
// 将源码切成 [kind, text] 段：code / lineComment / blockComment / string / char / textBlock。
// canonicalization 只允许对 code 段做整词类名改写（Java 类型 / self-reference 语义）；
// 字面量与注释段原样保留参与比较——任何 literal / 注释差异都会使比较失败，不得放行。
def segmentJavaSource = { String source ->
    def segments = []
    def buf = new StringBuilder()
    def emit = { String kind ->
        if (buf.length() > 0) {
            segments << [kind, buf.toString()]
            buf.setLength(0)
        }
    }
    int i = 0
    int n = source.length()
    while (i < n) {
        char c = source.charAt(i)
        if (c == '/' as char && i + 1 < n && source.charAt(i + 1) == '/' as char) {
            emit('code')
            int j = source.indexOf('\n', i)
            j = j < 0 ? n : j
            buf.append(source.substring(i, j))
            emit('lineComment')
            i = j
        } else if (c == '/' as char && i + 1 < n && source.charAt(i + 1) == '*' as char) {
            emit('code')
            int j = source.indexOf('*/', i + 2)
            j = j < 0 ? n : j + 2
            buf.append(source.substring(i, j))
            emit('blockComment')
            i = j
        } else if (c == '"' as char && i + 2 < n && source.charAt(i + 1) == '"' as char && source.charAt(i + 2) == '"' as char) {
            emit('code')
            int j = source.indexOf('"""', i + 3)
            j = j < 0 ? n : j + 3
            buf.append(source.substring(i, j))
            emit('textBlock')
            i = j
        } else if (c == '"' as char) {
            emit('code')
            int j = i + 1
            while (j < n) {
                char d = source.charAt(j)
                if (d == '\\' as char) {
                    j += 2
                } else if (d == '"' as char) {
                    j++
                    break
                } else {
                    j++
                }
            }
            j = Math.min(j, n)
            buf.append(source.substring(i, j))
            emit('string')
            i = j
        } else if (c == '\'' as char) {
            emit('code')
            int j = i + 1
            while (j < n) {
                char d = source.charAt(j)
                if (d == '\\' as char) {
                    j += 2
                } else if (d == '\'' as char) {
                    j++
                    break
                } else {
                    j++
                }
            }
            j = Math.min(j, n)
            buf.append(source.substring(i, j))
            emit('char')
            i = j
        } else {
            buf.append(c)
            i++
        }
    }
    emit('code')
    return segments
}

def canonicalizeRenamedSource = { String oldSource, Collection renamePairs ->
    def out = new StringBuilder()
    segmentJavaSource(oldSource).each { segment ->
        String text = segment[1]
        if (segment[0] == 'code') {
            // 只应用原文中真实出现的 rename 对（new 简名不会是任何行的 old 简名，原文过滤不影响结果）
            renamePairs.findAll { text.contains(it.simpleOld) }.each { pair ->
                text = text.replaceAll(
                        '\\b' + java.util.regex.Pattern.quote(pair.simpleOld) + '\\b',
                        java.util.regex.Matcher.quoteReplacement(pair.simpleNew))
            }
        }
        out.append(text)
    }
    return out.toString()
}

def firstDiffPreview = { String left, String right ->
    int idx = 0
    int limit = Math.min(left.length(), right.length())
    while (idx < limit && left.charAt(idx) == right.charAt(idx)) {
        idx++
    }
    int from = Math.max(0, idx - 80)
    int to = Math.min(idx + 160, Math.max(left.length(), right.length()))
    return "首个差异位置 ${idx}; left=[${left.substring(from, Math.min(to, left.length()))}] " +
            "right=[${right.substring(from, Math.min(to, right.length()))}]"
}

// ---- mapping → jar 条目路径映射 ----
def mapClassEntryPath = { String classEntry, Map<String, String> mapping ->
    def withoutSuffix = classEntry.substring(0, classEntry.length() - '.class'.length())
    String bestOldPath = null
    String bestNewFqcn = null
    mapping.each { oldFqcn, newFqcn ->
        def oldPath = oldFqcn.replace('.', '/')
        if ((withoutSuffix == oldPath || withoutSuffix.startsWith(oldPath + '$')) &&
                (bestOldPath == null || oldPath.length() > bestOldPath.length())) {
            bestOldPath = oldPath
            bestNewFqcn = newFqcn
        }
    }
    if (bestOldPath == null) {
        return classEntry
    }
    return bestNewFqcn.replace('.', '/') + withoutSuffix.substring(bestOldPath.length()) + '.class'
}

def mapSourceEntryPath = { String javaEntry, Map<String, String> mapping ->
    if (!javaEntry.endsWith('.java')) {
        return javaEntry
    }
    def fqcn = javaEntry.substring(0, javaEntry.length() - '.java'.length()).replace('/', '.')
    return mapping.containsKey(fqcn) ? mapping[fqcn].replace('.', '/') + '.java' : javaEntry
}

def mapMixinConfigEntries = { Object parsed, Map<String, String> mapping ->
    if (mapping.isEmpty() || parsed == null) {
        return parsed
    }
    def pkg = parsed.package?.toString()
    def clone = new LinkedHashMap<Object, Object>(parsed)
    ['mixins', 'client'].each { key ->
        if (clone.containsKey(key) && clone[key] != null) {
            clone[key] = (clone[key] as List).collect { entry ->
                def fqcn = "${pkg}.${entry}".toString()
                mapping.containsKey(fqcn) ? mapping[fqcn].substring(mapping[fqcn].lastIndexOf('.') + 1) : entry
            }
        }
    }
    return clone
}

// mapping 应用到 baseline class 条目集 → 期望 current 条目集（bijective 检测 + 对位表）。
// collision=true 表示同平台内两个 baseline 条目映射到同一目的地（fail closed）。
def computeClassEntryPartners = { Collection<String> baselineClassEntries, Map<String, String> mapping ->
    def mappedBaseline = [:]
    baselineClassEntries.each { entry ->
        def mapped = mapClassEntryPath(entry, mapping)
        if (mapped != entry) {
            mappedBaseline[entry] = mapped
        }
    }
    def unmapped = baselineClassEntries.findAll { !mappedBaseline.containsKey(it) }
    def expected = (unmapped.collect() + mappedBaseline.values()) as Set
    [expected: expected, mappedBaseline: mappedBaseline, collision: expected.size() != baselineClassEntries.size()]
}

// full mapping → asm Remapper 条目（internal name，按 old 路径长度降序 = longest-match 优先，
// 与 mapClassEntryPath 的 $ 内部类前缀传播语义一致）
def buildInternalRenameEntries = { Map<String, String> mapping ->
    mapping.collect { oldFqcn, newFqcn -> [oldFqcn.replace('.', '/'), newFqcn.replace('.', '/')] }
            .sort { a, b -> b[0].length() <=> a[0].length() }
}

// 普通 non-class 资源字节级差异检测（排除项由调用方传入：专项语义检查的资源不在此处重复检查）
def findDifferingOrdinaryResources = { Map<String, byte[]> baselineByName, Map<String, byte[]> currentByName, Closure isExcluded ->
    (baselineByName.keySet() + currentByName.keySet())
            .findAll { !isExcluded(it) }.sort().findAll { name ->
        def b = baselineByName[name]
        def c = currentByName[name]
        b == null || c == null || !java.util.Arrays.equals(b, c)
    }
}

// 普通资源字节级比较的专项语义检查排除项：fabric.mod.json（解析后逐键语义）与
// *.mixins.json（Phase 11 固定字段 / side membership / runtime target+priority 顺序专项证明）。
// pack.mcmeta 不豁免：完整字节一致 + pack_format 专项 invariant。
def isSpecialResourceEntry = { String name ->
    name == 'fabric.mod.json' || name.endsWith('.mixins.json')
}

// zip 条目清单统一只收集实际文件条目：ZIP directory entry（isDirectory()，名以 / 结尾，无文件内容，
// 对 mod 加载无语义）不参与 runtime / sources 等价比较。26.x 历史基线中的 data/、data/carpet-ice-addition/
// 目录条目源自本地未跟踪的空源目录（Git 不跟踪空目录），sterile（仅 Git 跟踪内容）构建不产出——
// 目录条目属打包噪声而非内容差异，纳入比较会使等价结论依赖本地未跟踪状态（P10-R1 实证）。
def readEntries = { File jarFile ->
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        zip.entries().toList().findAll { !it.isDirectory() }.collect { it.name } as Set<String>
    }
}

// ---- channel B：asm classfile 规范化（探测构建环境既有 asm / Gradle 发行版自带 asm，零新增依赖）----
def probeAsmClasses = { String pkg, ClassLoader loader ->
    try {
        Class.forName(pkg + '.ClassReader', false, loader)
        Class.forName(pkg + '.ClassWriter', false, loader)
        Class.forName(pkg + '.commons.ClassRemapper', false, loader)
        Class.forName(pkg + '.commons.SimpleRemapper', false, loader)
        return true
    } catch (Throwable ignored) {
        return false
    }
}

def asmProbeCache = [:]
def probeAsmSupport = { ->
    if (!asmProbeCache.isEmpty()) {
        return asmProbeCache.result
    }
    // 候选 1：脚本可见的 classloader 层级内既有 asm（含 Gradle 内部 impldep 着色副本）
    def candidateLoaders = []
    [this.class.classLoader, Thread.currentThread().contextClassLoader].each { start ->
        def cl = start
        while (cl != null) {
            candidateLoaders << cl
            cl = cl.parent
        }
    }
    for (String pkg in ['org.objectweb.asm', 'org.gradle.internal.impldep.org.objectweb.asm']) {
        for (ClassLoader loader in candidateLoaders.unique()) {
            if (probeAsmClasses(pkg, loader)) {
                asmProbeCache.result = [pkg: pkg, loader: loader, source: "classpath:${pkg}"]
                return asmProbeCache.result
            }
        }
    }
    // 候选 2：Gradle 发行版 lib/ 自带的 asm / asm-tree / asm-commons（随发行版分发，零新增依赖）
    try {
        def libDir = new File(project.gradle.gradleHomeDir, 'lib')
        def jars = ['asm', 'asm-tree', 'asm-commons'].collect { name ->
            def found = libDir.listFiles().findAll {
                it.name == "${name}.jar" || (it.name.startsWith("${name}-") && it.name.endsWith('.jar'))
            }.sort()
            assert !found.isEmpty(): "Gradle 发行版 lib/ 未找到 ${name} jar"
            found.last()
        }.unique()
        def loader = new java.net.URLClassLoader(jars.collect { it.toURI().toURL() } as java.net.URL[], this.class.classLoader)
        if (probeAsmClasses('org.objectweb.asm', loader)) {
            asmProbeCache.result = [pkg: 'org.objectweb.asm', loader: loader, source: "gradle-dist:${jars*.name.sort().join(',')}"]
            return asmProbeCache.result
        }
    } catch (Throwable ignored) {
        // 探测失败 → channel B 不可用（fail closed）
    }
    asmProbeCache.result = null
    return null
}

def asmCanonicalizerCache = [:]
def loadAsmCanonicalizer = { String pkg, ClassLoader loader ->
    def cacheKey = "${pkg}@${loader}".toString()
    if (asmCanonicalizerCache.containsKey(cacheKey)) {
        return asmCanonicalizerCache[cacheKey]
    }
    def dynamicLoader = new GroovyClassLoader(loader)
    def parsed = dynamicLoader.parseClass("""
        import ${pkg}.ClassReader
        import ${pkg}.ClassWriter
        import ${pkg}.ClassVisitor
        import ${pkg}.Opcodes
        import ${pkg}.commons.Remapper
        import ${pkg}.commons.ClassRemapper
        import ${pkg}.tree.ClassNode

        // 注意：parseClass 返回源码中的第一个类，目标入口类必须排在辅助类之前
        class RenameClassfileCanonicalizer {
            // 编译期调试元数据剔除（SourceFile / LineNumberTable）：SourceFile 为 self-name 元数据，
            // LineNumberTable 随源码行号布局变化（如 consolidation 引入门控注释行），
            // 二者均非语义载体，两侧统一剔除后做严格字节比较。
            private static ClassVisitor stripDebugVisitor(int api, ClassWriter writer) {
                return new ClassVisitor(api, writer) {
                    @Override
                    void visitSource(String source, String debug) {
                    }

                    @Override
                    org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                        def mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                        if (mv == null) {
                            return null
                        }
                        return new org.objectweb.asm.MethodVisitor(api, mv) {
                            @Override
                            void visitLineNumber(int line, org.objectweb.asm.Label label) {
                            }
                        }
                    }
                }
            }

            // internal name 重映射 + 编译期调试元数据剔除；字符串字面量不被重映射。
            // B 通道比较对象是结构与指令。严格路径：方法名不参与任何规范化。
            static byte[] canonicalize(byte[] classBytes, List renameEntries) {
                def api = Opcodes.ASM9
                def writer = new ClassWriter(0)
                new ClassReader(classBytes).accept(new ClassRemapper(stripDebugVisitor(api, writer), new PrefixClassRemapper(renameEntries)), 0)
                return writer.toByteArray()
            }

            // P9-C2a（2026-09-06 人工授权的最小规范化，仅限 ownership-transferred entries）：
            // 在严格 channel B 之上额外规范化 javac lambda 合成方法名序号。背景：javac 在 JDK 21→25 间
            // 将 lambda 序号分配从类全局计数改为按方法计数（实证：同一源文件 javac 21 产出 lambda\$new\$0 +
            // lambda\$start\$1，javac 25 产出 lambda\$new\$0 + lambda\$start\$0），旧 :common（javac 21）
            // 与 26.x 平台（java_toolchain=25，--release 25 必须 javac 25）之间不存在可消除该差异的
            // 构建模型改法。声明与全部 Methodref / MethodHandle / NameAndType 引用经同一 remapper 入口
            // 一致改写；字符串字面量不重映射；major 之外其余结构 / 指令 / 字面量差异仍 fail closed。
            static byte[] canonicalizeTransferred(byte[] classBytes, List renameEntries) {
                def api = Opcodes.ASM9
                def writer = new ClassWriter(0)
                new ClassReader(classBytes).accept(new ClassRemapper(stripDebugVisitor(api, writer), new TransferredLambdaCanonicalRemapper(renameEntries)), 0)
                return writer.toByteArray()
            }

            // Phase 11：从实际 runtime class 的 @Mixin annotation 提取 target/priority，
            // 用于证明 JSON 重新排序只发生在不同 target 或不同 priority 之间。
            static Map extractMixinMetadata(byte[] classBytes) {
                def node = new ClassNode()
                new ClassReader(classBytes).accept(node, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                def annotations = []
                if (node.visibleAnnotations != null) annotations.addAll(node.visibleAnnotations)
                if (node.invisibleAnnotations != null) annotations.addAll(node.invisibleAnnotations)
                def annotation = annotations.find { it.desc == 'Lorg/spongepowered/asm/mixin/Mixin;' }
                assert annotation != null: "runtime Mixin class lacks @Mixin annotation: \${node.name}"
                def values = [:]
                if (annotation.values != null) {
                    for (int i = 0; i < annotation.values.size(); i += 2) {
                        values[annotation.values[i].toString()] = annotation.values[i + 1]
                    }
                }
                def targets = new LinkedHashSet<String>()
                (values.value ?: []).each { type -> targets << type.internalName.toString() }
                (values.targets ?: []).each { target -> targets << target.toString().replace('.', '/') }
                assert !targets.isEmpty(): "runtime @Mixin annotation has no targets: \${node.name}"
                [targets: targets, priority: values.containsKey('priority') ? (values.priority as Number).intValue() : 1000]
            }

            static byte[] buildSampleClass(String internalName, String sourceFile, String literal, int lineNo) {
                return buildNamedMethodSample(internalName, sourceFile, 'hello', literal, lineNo)
            }

            static byte[] buildNamedMethodSample(String internalName, String sourceFile, String methodName, String literal, int lineNo) {
                def writer = new ClassWriter(0)
                writer.visit(Opcodes.V17, Opcodes.ACC_PUBLIC | Opcodes.ACC_SUPER, internalName, null, 'java/lang/Object', null)
                writer.visitSource(sourceFile, null)
                def mv = writer.visitMethod(Opcodes.ACC_PUBLIC, methodName, '()Ljava/lang/String;', null, null)
                mv.visitCode()
                def label = new org.objectweb.asm.Label()
                mv.visitLabel(label)
                mv.visitLineNumber(lineNo, label)
                mv.visitLdcInsn(literal)
                mv.visitInsn(Opcodes.ARETURN)
                mv.visitMaxs(1, 1)
                mv.visitEnd()
                writer.visitEnd()
                return writer.toByteArray()
            }

            // LDC 类常量引用 targetInternal：模拟 unchanged-FQCN class 内部引用 renamed class 的场景
            static byte[] buildRefSampleClass(String internalName, String sourceFile, String targetInternal, int lineNo) {
                def writer = new ClassWriter(0)
                writer.visit(Opcodes.V17, Opcodes.ACC_PUBLIC | Opcodes.ACC_SUPER, internalName, null, 'java/lang/Object', null)
                writer.visitSource(sourceFile, null)
                def mv = writer.visitMethod(Opcodes.ACC_PUBLIC, 'ref', '()Ljava/lang/Class;', null, null)
                mv.visitCode()
                def label = new org.objectweb.asm.Label()
                mv.visitLabel(label)
                mv.visitLineNumber(lineNo, label)
                mv.visitLdcInsn(org.objectweb.asm.Type.getObjectType(targetInternal))
                mv.visitInsn(Opcodes.ARETURN)
                mv.visitMaxs(1, 1)
                mv.visitEnd()
                writer.visitEnd()
                return writer.toByteArray()
            }
        }

        class PrefixClassRemapper extends Remapper {
            // 条目 [oldInternal, newInternal]，按 old 路径长度降序（longest-match 优先）；
            // 精确匹配整名改写，\$ 内部类按前缀传播（与 class 条目路径映射同语义）；
            // 成员名 / 方法描述符 / 字符串字面量不重映射（non-rename 语义保持原样）。
            private final List entries
            PrefixClassRemapper(List entries) { this.entries = entries }
            String map(String internalName) {
                for (Object e in entries) {
                    String oldPath = e[0]
                    if (internalName == oldPath) {
                        return e[1]
                    }
                    if (internalName.startsWith(oldPath + '\$')) {
                        return e[1] + internalName.substring(oldPath.length())
                    }
                }
                return internalName
            }
        }

        class TransferredLambdaCanonicalRemapper extends PrefixClassRemapper {
            // P9-C2a（2026-09-06 人工授权）：仅额外规范化 javac lambda 合成方法名序号
            // （lambda\$<method>\$<ordinal> 末段纯数字序号剥离 → lambda\$<method>）；
            // 方法声明与全部方法引用经 ClassRemapper 同一入口一致改写，不产生同名合并
            // （同方法多 lambda 剥离后重名时，两侧方法表顺序均为源码顺序，仍逐字节可比）。
            // 非 lambda 名称保持 map() 前缀语义；严格 channel B 不使用本类。
            TransferredLambdaCanonicalRemapper(List entries) { super(entries) }
            String mapMethodName(String owner, String name, String descriptor) {
                if (name.startsWith('lambda\$')) {
                    int ordinalSep = name.lastIndexOf('\$')
                    if (ordinalSep > 'lambda\$'.length()) {
                        String tail = name.substring(ordinalSep + 1)
                        boolean allDigits = !tail.isEmpty()
                        for (int i = 0; allDigits && i < tail.length(); i++) {
                            if (!Character.isDigit(tail.charAt(i))) {
                                allDigits = false
                            }
                        }
                        if (allDigits) {
                            return name.substring(0, ordinalSep)
                        }
                    }
                }
                return map(name)
            }
        }
    """)
    def result = [
            canonicalize: { byte[] bytes, List renameEntries ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'canonicalize', [bytes, renameEntries] as Object[])
            },
            canonicalizeTransferred: { byte[] bytes, List renameEntries ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'canonicalizeTransferred', [bytes, renameEntries] as Object[])
            },
            extractMixinMetadata: { byte[] bytes ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'extractMixinMetadata', [bytes] as Object[])
            },
            buildSample : { String internalName, String sourceFile, String literal, int lineNo ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'buildSampleClass', [internalName, sourceFile, literal, lineNo] as Object[])
            },
            buildNamedMethodSample: { String internalName, String sourceFile, String methodName, String literal, int lineNo ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'buildNamedMethodSample', [internalName, sourceFile, methodName, literal, lineNo] as Object[])
            },
            buildRefSample: { String internalName, String sourceFile, String targetInternal, int lineNo ->
                org.codehaus.groovy.runtime.InvokerHelper.invokeStaticMethod(parsed, 'buildRefSampleClass', [internalName, sourceFile, targetInternal, lineNo] as Object[])
            }
    ]
    asmCanonicalizerCache[cacheKey] = result
    return result
}

def channelBEquivalence = { byte[] oldClassBytes, byte[] newClassBytes, Map<String, String> mapping ->
    def asm = probeAsmSupport()
    if (asm == null) {
        return 'channel B 不可用（构建环境无既有 asm/asm-commons，按规约不新增依赖）'
    }
    try {
        def canonicalizer = loadAsmCanonicalizer(asm.pkg, asm.loader)
        def renameEntries = buildInternalRenameEntries(mapping)
        def canonicalOld = canonicalizer.canonicalize(oldClassBytes, renameEntries)
        def canonicalNew = canonicalizer.canonicalize(newClassBytes, [])
        if (java.util.Arrays.equals(canonicalOld, canonicalNew)) {
            return null
        }
        return 'channel B classfile 规范形态不等价（存在 rename 之外的结构 / 指令 / 字面量差异）'
    } catch (Throwable t) {
        return "channel B 执行失败（fail closed）: ${t}"
    }
}

// ==================== Phase 9（P9-C1）：ownership transfer 两层模型 ====================
// 背景：:common Java 子项目退出后，原 common 27 个 source owner 迁入根 src/main/java，
// 各平台 sources jar 将「新增」这些 source，runtime classfile major 将从旧 :common 统一的
// 65（--release 21）变为各平台 java_release+44（1.21.x=65 不变，26.x=65→69）。
// 两层模型（均自动推导、fail closed，不做全局 classfile version 豁免）：
//   Layer 1 ownershipTransferredSourceOwners：顶层 source / FQCN 单位，须同时满足
//     a) current sources 新增；b) baseline sources 无对应 source（a 已隐含）；
//     c) 根 src/main/java 存在对应 source 文件；d) baseline/current runtime jar 有 mapping-aware class 对位；
//     且 11 平台集合一致，规模必须为空（未迁移树 no-op）或恰为 27（Phase 9 迁移清单）；
//   Layer 2 ownershipTransferredClassEntries：每个 owner 纳入 X.class 与 X$*.class
//     （nested record / enum / inner / synthetic 命名），每个 entry 独立通过 step 1 的
//     mapping-aware bijective 对位，且独立通过下方 proveTransferredEntry 证明。
// proveTransferredEntry：major invariant（baseline==65；current==java_release+44；minor==0 非 preview）
//   + 字节一致 → scoped channel B。scoped 规范化范围（2026-09-06 人工授权，仅限 transferred entries）：
//   ① 预期 major 字节（65 → java_release+44，javac --release 差异）；
//   ② javac lambda 合成方法名序号（javac 21 类全局计数 → 25 按方法计数，javac 21→25 编译器行为差异，
//      26.x toolchain=25 与旧 :common javac 21 之间不存在可消除它的构建模型改法）。
//   minor 与其余全部结构 / 指令 / 字面量差异 fail closed；非 transferred class 的证明路径与
//   classfile version 严格性完全不变（严格 channel B 不做任何 lambda 序号规范化）。
def readClassfileVersion = { byte[] bytes ->
    [minor: ((bytes[4] & 0xFF) << 8) | (bytes[5] & 0xFF),
     major: ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)]
}

def withClassfileMajor = { byte[] bytes, int major ->
    def copy = bytes.clone()
    copy[6] = (byte) ((major >> 8) & 0xFF)
    copy[7] = (byte) (major & 0xFF)
    copy
}

// Layer 2：单 source owner 的 runtime class-entry 集合（X.class + X$*.class）
def ownershipTransferredEntriesForOwner = { String ownerFqcn, Collection<String> classEntries ->
    def ownerPath = ownerFqcn.replace('.', '/')
    classEntries.findAll { it == "${ownerPath}.class".toString() || it.startsWith("${ownerPath}\$") } as Set
}

// ownership-transferred class entry 的等价证明。
// 返回 [ok:true, mode:'byte-identical'] / [ok:true, mode:'channelB'] / [ok:false, reason:String]。
def proveTransferredEntry = { byte[] baselineBytes, byte[] currentBytes, int expectedCurrentMajor, Map<String, String> mapping ->
    def baselineVersion = readClassfileVersion(baselineBytes)
    def currentVersion = readClassfileVersion(currentBytes)
    if (baselineVersion.major != 65) {
        return [ok: false, reason: "transferred baseline major 必须为 65（旧 :common --release 21），实际 ${baselineVersion.major}"]
    }
    if (currentVersion.major != expectedCurrentMajor) {
        return [ok: false, reason: "transferred current major ${currentVersion.major} != 期望 java_release+44=${expectedCurrentMajor}"]
    }
    if (baselineVersion.minor != 0 || currentVersion.minor != 0) {
        return [ok: false, reason: "transferred classfile minor 必须为 0（非 preview），baseline=${baselineVersion.minor} current=${currentVersion.minor}"]
    }
    if (java.util.Arrays.equals(baselineBytes, currentBytes)) {
        return [ok: true, mode: 'byte-identical']
    }
    def asm = probeAsmSupport()
    if (asm == null) {
        return [ok: false, reason: 'channel B 不可用（构建环境无既有 asm/asm-commons，按规约不新增依赖）']
    }
    try {
        def canonicalizer = loadAsmCanonicalizer(asm.pkg, asm.loader)
        def renameEntries = buildInternalRenameEntries(mapping)
        def canonicalOld = canonicalizer.canonicalizeTransferred(baselineBytes, renameEntries)
        def canonicalNew = canonicalizer.canonicalizeTransferred(currentBytes, [])
        // scoped 规范化（2026-09-06 人工授权，仅限 transferred entries）：预期 major 字节（offset 6-7）
        // 与 javac lambda 合成方法名序号（javac 21 类全局计数 → 25 按方法计数）允许不同；
        // minor 与其余全部结构 / 指令 / 字面量字节严格比较
        [canonicalOld, canonicalNew].each { bytes ->
            bytes[6] = 0 as byte
            bytes[7] = 0 as byte
        }
        if (java.util.Arrays.equals(canonicalOld, canonicalNew)) {
            return [ok: true, mode: 'channelB']
        }
        return [ok: false, reason: 'transferred channel B 规范形态不等价（预期 major 之外存在结构 / 指令 / 字面量差异，fail closed）']
    } catch (Throwable t) {
        return [ok: false, reason: "transferred channel B 执行失败（fail closed）: ${t}"]
    }
}

// Phase 6 jar 内容级等价对照：与基线快照逐平台比对（mapping 感知版）。
// 用法：.\gradlew.bat verifyJarEquivalence -PbaselineDir=<快照根目录>（建议绝对路径）
// 比对项：zip 条目清单（只含实际文件条目——ZIP directory entry 不参与，见 readEntries；
// com/ice2974/ class 条目按显式 mapping 做 bijective 对齐，其余条目严格同名）、
// 全部项目 class partner（未改名同名对位 / 已改名按 mapping 对位）的内容级等价证明
// （字节一致 → channel A sources 规范化 → channel B classfile 规范化兜底）、
// fabric.mod.json 解析后逐键语义、*.mixins.json（字节一致，或 Phase 11 target/priority-aware 顺序等价）、
// 普通非 class 资源字节级一致（含珊瑚资源包 pack.mcmeta；pack_format 另有专项 invariant）、
// 全部 class 的 intermediary 引用集合（P4-1 防线）；sources jar 存在性 + mapping 感知条目覆盖。
// Phase 9 起：sources 新增条目可通过 ownership transfer 两层模型（P9-C1）解释为
// 「:common → 根 src/main/java」迁移，条件与 fail-closed 语义见上方 Phase 9 说明块。
def verifyJarEquivalence = tasks.register('verifyJarEquivalence') {
    doLast {
        def baselineDirName = project.findProperty('baselineDir')
        if (baselineDirName == null) {
            throw new GradleException('缺少 -PbaselineDir=<全量构建快照根目录>（快照内使用正名前 legacy 平台目录名 platform-mcXXXX：<legacy>/build/libs（flat）或 versions/<legacy>/build/libs，建议绝对路径）')
        }
        def baselineRoot = rootProject.file(baselineDirName)
        def mapping = loadClassRenameMapping()
        if (!mapping.isEmpty()) {
            println "class rename mapping: ${mapping.size()} 条（verifyJarEquivalence 按 mapping 做 bijective 对齐与 renamed-pair 等价验证）"
        }

        // P9-C1：跨平台 ownership transfer 一致性收集（platform name -> [owners, entriesByOwner]）
        def ownershipPerPlatform = [:]

        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def currentJar = outputTask.archiveFile.get().asFile
            assert currentJar.isFile(): "Missing release JAR for ${projectPath}: ${currentJar}"

            // P8 正名后当前项目名为实际版本号（1.21.1 等）；baseline 快照目录仍为正名前 legacy 目录名
            def legacyDirName = legacyBaselineDirNames[platform.name]
            assert legacyDirName != null:
                    "legacyBaselineDirNames 缺少当前平台 ${platform.name} 的 baseline 目录登记（防漂移断言未同步维护）"
            def baselineJarCandidates = [
                    new File(baselineRoot, "${legacyDirName}/build/libs/${currentJar.name}"),
                    new File(baselineRoot, "versions/${legacyDirName}/build/libs/${currentJar.name}")
            ]
            def baselineJar = baselineJarCandidates.find { it.isFile() }
            assert baselineJar != null:
                    "Baseline JAR not found for ${projectPath}（尝试过: ${baselineJarCandidates*.path}）；" +
                    'baseline 快照永久只读，不得修改 / 重建 P6-baseline-final'

            def sourcesName = { String jarName -> "${jarName.substring(0, jarName.length() - 4)}-sources.jar" }
            def currentSourcesJar = new File(currentJar.parentFile, sourcesName(currentJar.name))
            def baselineSourcesJar = new File(baselineJar.parentFile, sourcesName(baselineJar.name))
            assert currentSourcesJar.isFile(): "Missing current sources JAR for ${projectPath}"
            assert baselineSourcesJar.isFile(): "Baseline sources JAR not found for ${projectPath}"

            def readEntryBytes = { File jarFile, String entryName ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    def entry = zip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("Entry ${entryName} not found in ${jarFile.name}")
                    }
                    zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                }
            }
            def readEntryText = { File jarFile, String entryName ->
                new String(readEntryBytes(jarFile, entryName), java.nio.charset.StandardCharsets.UTF_8)
            }
            def currentEntries = readEntries(currentJar)
            def baselineEntries = readEntries(baselineJar)

            // ---- 1) 条目集合：com/ice2974/ class 条目按显式 mapping 做 bijective 对齐，其余条目严格同名 ----
            def isOurClassEntry = { String name -> name.startsWith('com/ice2974/') && name.endsWith('.class') }
            def baselineClassEntries = (baselineEntries.findAll(isOurClassEntry) as Set) as List
            def currentClassEntriesSet = currentEntries.findAll(isOurClassEntry) as Set
            def partners = computeClassEntryPartners(baselineClassEntries, mapping)
            assert !partners.collision:
                    "class rename mapping 在 ${projectPath} 产生映射碰撞：mapping 应用后期望 ${partners.expected.size()} 条，" +
                    "baseline 有 ${baselineClassEntries.size()} 条（同一平台内映射后必须一一对应）"
            assert currentClassEntriesSet == partners.expected:
                    "Zip class entry mismatch for ${currentJar.name} vs ${baselineJar.name} (mapping-aware):\n" +
                    "  missing in current: ${(partners.expected - currentClassEntriesSet).sort()}\n" +
                    "  extra in current: ${(currentClassEntriesSet - partners.expected).sort()}"
            def destToOldEntry = partners.mappedBaseline.collectEntries { oldEntry, destEntry -> [destEntry, oldEntry] }
            def currentOtherEntries = currentEntries.findAll { !isOurClassEntry(it) } as Set
            def baselineOtherEntries = baselineEntries.findAll { !isOurClassEntry(it) } as Set
            assert currentOtherEntries == baselineOtherEntries:
                    "Zip non-class entry mismatch for ${currentJar.name} vs ${baselineJar.name}:\n" +
                    "  missing in current: ${(baselineOtherEntries - currentOtherEntries).sort()}\n" +
                    "  extra in current: ${(currentOtherEntries - baselineOtherEntries).sort()}"

            // ---- 2) sources jar 条目覆盖（mapping 感知）----
            // 门控空文件被同路径 override 吸收时条目数可合并减少，故做双向覆盖检查而非条目数相等。
            def isOurSourceEntry = { String name -> name.startsWith('com/ice2974/') && name.endsWith('.java') }
            def currentSourcesEntries = readEntries(currentSourcesJar)
            def baselineSourcesEntries = readEntries(baselineSourcesJar)
            def expectedSourcesDestinations = baselineSourcesEntries.findAll(isOurSourceEntry)
                    .collect { mapSourceEntryPath(it, mapping) } as Set
            baselineSourcesEntries.findAll(isOurSourceEntry).each { entry ->
                def dest = mapSourceEntryPath(entry, mapping)
                assert currentSourcesEntries.contains(dest):
                        "sources entry ${entry} 期望映射到 ${dest} 但当前 sources jar 缺失（${projectPath}）"
            }
            def unexplainedSources = currentSourcesEntries.findAll(isOurSourceEntry)
                    .findAll { !expectedSourcesDestinations.contains(it) }

            // ---- 2b) P9-C1 Layer 1：ownershipTransferredSourceOwners 推导（fail closed）----
            // unexplainedSources 中仅「:common → 根 src/main/java 所有权迁移」可被解释（条件 a-d 见 Phase 9 说明块），
            // 其余未知来源仍 fail closed。
            def deriveOwnerFqcn = { String sourceEntry ->
                sourceEntry.substring(0, sourceEntry.length() - '.java'.length()).replace('/', '.')
            }
            def transferredSourceOwners = [] as Set
            unexplainedSources.sort().each { String sourceEntry ->
                def ownerFqcn = deriveOwnerFqcn(sourceEntry)
                def ownerPath = ownerFqcn.replace('.', '/')
                def rootSourceFile = new File(rootDir, "src/main/java/${sourceEntry}".toString())
                def baselineOwnerEntry = "${ownerPath}.class".toString()
                def expectedCurrentOwnerEntry = mapClassEntryPath(baselineOwnerEntry, mapping)
                boolean rootSourceExists = rootSourceFile.isFile()
                boolean runtimePaired = baselineClassEntries.contains(baselineOwnerEntry) &&
                        currentClassEntriesSet.contains(expectedCurrentOwnerEntry)
                if (rootSourceExists && runtimePaired) {
                    transferredSourceOwners << ownerFqcn
                }
            }
            def nonTransferredUnexplained = unexplainedSources.findAll { sourceEntry ->
                !transferredSourceOwners.contains(deriveOwnerFqcn(sourceEntry))
            }
            assert nonTransferredUnexplained.isEmpty():
                    "当前 sources jar 存在无法解释的来源条目（${projectPath}；P9 ownership transfer 条件不满足即 fail closed）: " +
                    nonTransferredUnexplained.sort()

            // ---- 2c) P9-C1 Layer 2：ownershipTransferredClassEntries 推导（X.class + X$*.class）----
            // 每个 source owner 纳入其全部 runtime class entries；27 个 source owner 不是 27 个 class entry。
            // 每个 entry 仍独立确认通过 step 1 的 mapping-aware bijective 对位（防御性 fail closed）。
            def transferredClassEntries = [] as Set
            def transferredEntriesByOwner = [:].withDefault { [] as Set }
            transferredSourceOwners.sort().each { String ownerFqcn ->
                def ownerEntries = ownershipTransferredEntriesForOwner(ownerFqcn, currentClassEntriesSet)
                assert !ownerEntries.isEmpty():
                        "transferred source owner ${ownerFqcn} 在 current jar 无 runtime class entry（${projectPath}）"
                ownerEntries.each { String entry ->
                    def baselinePartner = destToOldEntry.containsKey(entry) ? destToOldEntry[entry] : entry
                    assert baselineEntries.contains(baselinePartner):
                            "transferred class entry ${entry} 无 baseline mapping-aware 对位（${projectPath}）"
                    transferredClassEntries << entry
                    transferredEntriesByOwner[ownerFqcn] << entry
                }
            }
            ownershipPerPlatform[platform.name] = [owners: transferredSourceOwners, entriesByOwner: transferredEntriesByOwner]

            // ---- 3) 全部项目 class partner 内容级等价证明 ----
            // 未改名 class：同名 ↔ 同名；已改名 class：按显式 mapping 对位（第 1 步已断言 bijective）。
            // 每个 partner 都必须给出内容级证明：classfile 字节一致（rename 未波及）→
            // channel A sources 规范化（覆盖 FQCN 未变但引用了 renamed class 的项目类）→
            // channel B classfile 规范化兜底（sources 缺失如 $ 内部类，或 A 不等价时）。
            // 三条路都走不通即 fail closed。
            def renamePairs = mapping.collect { oldFqcn, newFqcn ->
                [simpleOld: oldFqcn.substring(oldFqcn.lastIndexOf('.') + 1),
                 simpleNew: newFqcn.substring(newFqcn.lastIndexOf('.') + 1)]
            }
            def sourceTextOrNull = { File jarFile, String entryName ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    def entry = zip.getEntry(entryName)
                    entry == null ? null : zip.getInputStream(entry).withCloseable {
                        new String(it.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                    }
                }
            }
            def contentProofFailures = []
            def channelBProven = []
            def transferredProofModes = [:]
            def transferredChannelB = []
            int byteIdenticalCount = 0
            int channelARenamedCount = 0
            int channelAUnchangedCount = 0
            def expectedCurrentMajor = platform.java_release.toInteger() + 44
            baselineClassEntries.sort(false).each { baselineEntry ->
                def currentEntry = mapClassEntryPath(baselineEntry, mapping)
                def oldClassBytes = readEntryBytes(baselineJar, baselineEntry)
                def newClassBytes = readEntryBytes(currentJar, currentEntry)
                boolean transferred = transferredClassEntries.contains(currentEntry)
                if (transferred) {
                    // P9-C1：ownership-transferred entry 走专用证明（major invariant + scoped channel B）；
                    // baseline sources 无对应 source（Layer 1 条件 b），channel A 天然不可用
                    def proof = proveTransferredEntry(oldClassBytes, newClassBytes, expectedCurrentMajor, mapping)
                    if (!proof.ok) {
                        contentProofFailures << "${currentEntry} (ownership-transferred): ${proof.reason}"
                        return
                    }
                    transferredProofModes[currentEntry] = proof.mode
                    if (proof.mode == 'channelB') {
                        transferredChannelB << currentEntry
                    }
                    return
                }
                if (java.util.Arrays.equals(oldClassBytes, newClassBytes)) {
                    byteIdenticalCount++
                    return
                }
                boolean renamed = currentEntry != baselineEntry
                def oldFqcn = baselineEntry.substring(0, baselineEntry.length() - '.class'.length()).replace('/', '.')
                def newFqcn = currentEntry.substring(0, currentEntry.length() - '.class'.length()).replace('/', '.')
                def oldSourceEntry = baselineEntry.substring(0, baselineEntry.length() - '.class'.length()) + '.java'
                def newSourceEntry = currentEntry.substring(0, currentEntry.length() - '.class'.length()) + '.java'
                def oldText = sourceTextOrNull(baselineSourcesJar, oldSourceEntry)
                def newText = sourceTextOrNull(currentSourcesJar, newSourceEntry)
                if (oldText != null && newText != null) {
                    def canonicalOld = canonicalizeRenamedSource(oldText, renamePairs)
                    if (canonicalOld == newText) {
                        if (renamed) {
                            channelARenamedCount++
                            println "renamed pair OK (channel A sources): ${oldFqcn} -> ${newFqcn} (${projectPath})"
                        } else {
                            channelAUnchangedCount++
                        }
                        return
                    }
                }
                // channel A 不适用（sources 缺失）或不等价 → channel B classfile 规范化兜底（full mapping remap）
                def channelBResult = channelBEquivalence(oldClassBytes, newClassBytes, mapping)
                def pairLabel = renamed ? "${oldFqcn} -> ${newFqcn}" : "${newFqcn} (FQCN unchanged)"
                if (channelBResult == null) {
                    channelBProven << pairLabel
                    println "class OK (channel B classfile): ${pairLabel} (${projectPath})"
                    return
                }
                def channelANote = (oldText == null || newText == null)
                        ? 'channel A 不适用（sources entry 缺失）'
                        : "channel A 源码不等价（${firstDiffPreview(canonicalizeRenamedSource(oldText, renamePairs), newText)}）"
                contentProofFailures << "${pairLabel}: ${channelANote}；${channelBResult}"
            }
            assert contentProofFailures.isEmpty():
                    "项目 class 内容级等价验证失败（fail closed，请人工分析；唯一允许的差异来源是显式 class rename mapping）:\n" +
                    contentProofFailures.collect { '  - ' + it }.join('\n')
            println "class content proof OK (${projectPath}): total=${baselineClassEntries.size()}, " +
                    "byteIdentical=${byteIdenticalCount}, " +
                    "channelA=${channelARenamedCount + channelAUnchangedCount} (renamed ${channelARenamedCount}, unchanged-FQCN ${channelAUnchangedCount}), " +
                    "channelB=${channelBProven.size()}${channelBProven.isEmpty() ? '' : ': ' + channelBProven.sort().join(', ')}"
            if (!transferredClassEntries.isEmpty()) {
                int transferredByteIdentical = transferredProofModes.values().count { it == 'byte-identical' }
                println "ownership-transferred proof OK (${projectPath}): entries=${transferredClassEntries.size()} " +
                        "(owners=${transferredSourceOwners.size()}), byteIdentical=${transferredByteIdentical}, " +
                        "channelB=${transferredChannelB.size()}${transferredChannelB.isEmpty() ? '' : ': ' + transferredChannelB.sort().join(', ')}"
                if (!transferredChannelB.isEmpty()) {
                    println "提示：ownership-transferred 存在非 byte-identical 条目（scoped channel B 已证等价，除预期 major 外无差异；列此处供人工复核）" +
                            "（${projectPath}）: ${transferredChannelB.sort()}"
                }
            }

            // ---- 3b) P9-C1 sources 新增条目的 ownership transfer 解释收口 ----
            // sources 新增仅在 owner 属于 Layer 1 且其全部 Layer 2 runtime entries 已通过
            // byte-identical / scoped channel-B 等价证明后才被接受，否则 fail closed。
            transferredSourceOwners.sort().each { String ownerFqcn ->
                def unproven = transferredEntriesByOwner[ownerFqcn].findAll { !transferredProofModes.containsKey(it) }
                assert unproven.isEmpty():
                        "sources 新增 owner ${ownerFqcn} 的 ownership transfer 解释不被接受（${projectPath}）：" +
                        "以下 runtime entries 未完成 byte-identical / scoped channel-B 等价证明: ${unproven.sort()}"
            }

            // fabric.mod.json：模板展开值应完全相同，解析后逐键语义一致
            def slurper = new groovy.json.JsonSlurper()
            def currentModJson = slurper.parseText(readEntryText(currentJar, 'fabric.mod.json'))
            def baselineModJson = slurper.parseText(readEntryText(baselineJar, 'fabric.mod.json'))
            assert currentModJson == baselineModJson:
                    "fabric.mod.json semantic mismatch for ${currentJar.name} vs ${baselineJar.name}"

            // Phase 11 Mixin config migration proof：优先字节级一致；否则固定字段与 side membership
            // mapping-aware 全等，并从实际 resolved runtime class 的 @Mixin annotation 提取 target/priority。
            // 任意同 target 且同 priority pair 的相对顺序必须保持；只有不同 target/priority 的文本顺序可变化。
            currentEntries.findAll { it.endsWith('.mixins.json') }.sort().each { entryName ->
                def baselineConfigBytes = readEntryBytes(baselineJar, entryName)
                def currentConfigBytes = readEntryBytes(currentJar, entryName)
                if (java.util.Arrays.equals(baselineConfigBytes, currentConfigBytes)) {
                    return
                }
                def baselineConfig = slurper.parseText(new String(baselineConfigBytes, java.nio.charset.StandardCharsets.UTF_8))
                def currentConfig = slurper.parseText(new String(currentConfigBytes, java.nio.charset.StandardCharsets.UTF_8))
                def mappedConfig = mapMixinConfigEntries(baselineConfig, mapping)
                def fixedConfig = { Map config ->
                    new LinkedHashMap(config.findAll { key, _ -> !(key in ['mixins', 'client']) })
                }
                assert fixedConfig(mappedConfig as Map) == fixedConfig(currentConfig as Map):
                        "mixin config fixed fields differ between ${currentJar.name} and ${baselineJar.name}:\n" +
                        "  baseline(mapped): ${fixedConfig(mappedConfig as Map)}\n  current: ${fixedConfig(currentConfig as Map)}"

                def asm = probeAsmSupport()
                assert asm != null:
                        'Phase 11 Mixin order proof requires existing Gradle ASM support (no new dependency fallback)'
                def metadataExtractor = loadAsmCanonicalizer(asm.pkg, asm.loader).extractMixinMetadata
                def packagePath = currentConfig.package.toString().replace('.', '/')
                int constrainedPairs = 0
                ['mixins', 'client'].each { side ->
                    def oldList = ((mappedConfig[side] ?: []) as List).collect { it.toString() }
                    def newList = ((currentConfig[side] ?: []) as List).collect { it.toString() }
                    assert oldList.size() == oldList.toSet().size() && newList.size() == newList.toSet().size():
                            "mixin config ${side} contains duplicate entries (${currentJar.name})"
                    assert oldList as Set == newList as Set:
                            "mixin config ${side} membership differs between ${currentJar.name} and ${baselineJar.name}:\n" +
                            "  missing=${((oldList as Set) - (newList as Set)).sort()}\n" +
                            "  extra=${((newList as Set) - (oldList as Set)).sort()}"
                    def metadata = newList.collectEntries { mixinName ->
                        def classEntry = "${packagePath}/${mixinName}.class".toString()
                        [(mixinName): metadataExtractor(readEntryBytes(currentJar, classEntry))]
                    }
                    for (int left = 0; left < newList.size(); left++) {
                        for (int right = left + 1; right < newList.size(); right++) {
                            def first = newList[left]
                            def second = newList[right]
                            def firstMeta = metadata[first]
                            def secondMeta = metadata[second]
                            if (firstMeta.priority == secondMeta.priority &&
                                    !(firstMeta.targets as Set).intersect(secondMeta.targets as Set).isEmpty()) {
                                constrainedPairs++
                                assert oldList.indexOf(first) < oldList.indexOf(second):
                                        "Mixin order changed for same-target/same-priority pair in ${currentJar.name}: " +
                                        "baseline has ${second} before ${first}, current has ${first} before ${second}; " +
                                        "targets=${(firstMeta.targets as Set).intersect(secondMeta.targets as Set).sort()} priority=${firstMeta.priority}"
                            }
                        }
                    }
                }
                println "mixin config OK (Phase 11 target/priority-aware order proof): ${entryName} " +
                        "(${currentJar.name}; constrainedPairs=${constrainedPairs})"
            }

            // 珊瑚资源包 pack.mcmeta 的 pack_format 专项 invariant（pack.mcmeta 完整字节一致
            // 已由下方普通资源比较保证，此处保留独立断言作为显式语义防线）
            def packMetaPath = 'resourcepacks/craftable_coral_blocks/pack.mcmeta'
            def currentPackFormat = slurper.parseText(readEntryText(currentJar, packMetaPath)).pack.pack_format
            def baselinePackFormat = slurper.parseText(readEntryText(baselineJar, packMetaPath)).pack.pack_format
            assert currentPackFormat == baselinePackFormat:
                    "pack_format mismatch for ${currentJar.name}: current=${currentPackFormat} baseline=${baselinePackFormat}"

            // 普通非 class 资源严格内容比较：fabric.mod.json（语义逐键）与 *.mixins.json（mapping 感知
            // 解析等价）走专项语义检查；其余（含珊瑚资源包 pack.mcmeta，另有上方 pack_format 专项
            // invariant）路径相同的 non-class 条目必须字节级一致；rename 不是资源内容差异的豁免理由。
            def ordinaryResourceNames = baselineOtherEntries.findAll { !isSpecialResourceEntry(it) }
            def differingResources = findDifferingOrdinaryResources(
                    ordinaryResourceNames.collectEntries { [it, readEntryBytes(baselineJar, it)] },
                    ordinaryResourceNames.collectEntries { [it, readEntryBytes(currentJar, it)] },
                    isSpecialResourceEntry)
            assert differingResources.isEmpty():
                    "ordinary resource content mismatch for ${currentJar.name}（mapping 之外的普通资源内容差异必须失败）:\n" +
                    differingResources.collect { '  - ' + it }.join('\n')
            println "ordinary resources byte-identical: ${ordinaryResourceNames.size()} entries (${currentJar.name})"

            // P4-1 intermediary 引用集合语义比较（mapping 感知：renamed class 与 baseline 对位条目比较）。
            // 实证记录：本项目 loom 构建不产出 refmap（注解目标在 remapJar 时直接重映射进 class 常量池，
            // mixin json 无 refmap 指针），因此命名空间迁移的语义验证对象是 class 文件内的
            // (class|method|field)_NNNN intermediary 引用集合：对位 class 在两侧 jar 中集合必须完全一致。
            // plain 形态（26.x）无 intermediary，该检查空集通过，renamed-pair 语义由 channel A/B 承担。
            def intermediaryPattern = ~/(?:class|method|field)_[0-9]+/
            def readIntermediaryRefs = { File jarFile, Collection<String> entryNames ->
                def result = [:]
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    entryNames.each { entryName ->
                        def bytes = zip.getInputStream(zip.getEntry(entryName)).withCloseable { it.readAllBytes() }
                        def matcher = intermediaryPattern.matcher(new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1))
                        def refs = new TreeSet<String>()
                        while (matcher.find()) {
                            refs << matcher.group()
                        }
                        result[entryName] = refs
                    }
                }
                result
            }
            def currentRefs = readIntermediaryRefs(currentJar, currentClassEntriesSet.sort())
            def baselineRefs = readIntermediaryRefs(baselineJar, baselineClassEntries.sort())
            currentClassEntriesSet.sort().each { entryName ->
                def baselinePartner = destToOldEntry.containsKey(entryName) ? destToOldEntry[entryName] : entryName
                assert currentRefs[entryName] == baselineRefs[baselinePartner]:
                        "intermediary reference set differs for ${entryName} (baseline: ${baselinePartner}) in ${currentJar.name} vs ${baselineJar.name}:\n" +
                        "  only in current: ${(currentRefs[entryName] - baselineRefs[baselinePartner]).sort()}\n" +
                        "  only in baseline: ${(baselineRefs[baselinePartner] - currentRefs[entryName]).sort()}"
            }
            println "intermediary refs OK: ${currentClassEntriesSet.size()} classes (${currentJar.name})"

            println "Phase 6 equivalence OK: ${currentJar.name}"
        }

        // ---- P9-C1：ownership transfer 跨平台一致性（两层模型全局 fail closed）----
        def expectedPlatformNames = platformProjects.collect { project(it).name } as Set
        assert ownershipPerPlatform.keySet() == expectedPlatformNames:
                "ownership transfer 推导未覆盖全部平台：recorded=${ownershipPerPlatform.keySet().sort()} expected=${expectedPlatformNames.sort()}"
        def ownerSetsByPlatform = ownershipPerPlatform.collectEntries { name, data -> [name, data.owners] }
        def distinctOwnerSets = ownerSetsByPlatform.values().toSet()
        assert distinctOwnerSets.size() == 1:
                "ownershipTransferredSourceOwners 集合跨平台不一致（fail closed）：\n" +
                ownerSetsByPlatform.collect { name, owners -> "  ${name}: ${owners.sort()}" }.join('\n')
        def globalOwners = (distinctOwnerSets.first() as Set).sort()
        assert globalOwners.isEmpty() || globalOwners.size() == 27:
                "ownershipTransferredSourceOwners 推导结果必须为空（未迁移树 no-op）或恰为 27（Phase 9 迁移 source owner 清单），实际 ${globalOwners.size()}:\n" +
                globalOwners.collect { '  - ' + it }.join('\n')
        if (globalOwners.isEmpty()) {
            println 'P9 ownership transfer: 空（未迁移树 no-op，verifier 对 Phase 8 产物行为不变）'
        } else {
            println "P9 ownershipTransferredSourceOwners（Layer 1）: ${globalOwners.size()} 个 source owner:"
            globalOwners.each { println "  - ${it}" }
            // Layer 2：同 owner 的 runtime class-entry 集合必须逐平台一致（编译器生成集合差异即 fail closed）
            def referenceEntriesByOwner = null
            ownershipPerPlatform.each { name, data ->
                if (referenceEntriesByOwner == null) {
                    referenceEntriesByOwner = data.entriesByOwner
                } else {
                    assert data.entriesByOwner == referenceEntriesByOwner:
                            "Layer 2 runtime class-entry 集合跨平台不一致（${name}）: " +
                            "本平台 owners=${data.entriesByOwner.keySet().sort()}，参照 owners=${referenceEntriesByOwner.keySet().sort()}"
                }
            }
            int transferredEntryTotal = referenceEntriesByOwner.values().collect { it.size() }.sum()
            println "P9 ownershipTransferredClassEntries（Layer 2）: 每平台共 ${transferredEntryTotal} 个 runtime class entry，跨平台集合一致"
        }
    }
}

// ==================== Phase 6（P6-1）：class rename mapping 仓库一致性防线 ====================
// 分层检查（不做全仓 raw grep）：
//   层 1 mapping 文件：语法、终态、简名交叠断言（loadClassRenameMapping）；mapping 文件自身排除在扫描外；
//   层 2 active Java 类型 / 文件：old FQCN 的源文件与类型声明必须已不存在；new FQCN 源文件与类型声明必须存在；
//   层 3 Mixin JSON：平台 mixin 配置不得再引用 old 简名；
//   层 4 功能性引用：active .java 的 code 段 / 字面量段出现 old 简名必须失败；
//        注释段仅报告不失败（历史说明允许保留）；gradle / CI / 资源文件出现 old 简名或 FQCN 必须失败；
//   范围排除：docs/、references/、README*、AGENTS.md、构建输出与历史快照（历史文档允许保留旧名）。
def verifyClassRenameMapping = tasks.register('verifyClassRenameMapping') {
    group = 'verification'
    description = 'Phase 6：显式 class rename mapping 与仓库现状的分层一致性检查'
    doLast {
        def mapping = loadClassRenameMapping()
        println "class rename mapping: ${mapping.size()} 条"

        // P9：common/src/{main,test}/java 已随 common Java 子项目退出删除（原 27 个 source owner 迁入根 src/main/java）；
        // core 平台单元测试目录 versions/<mainProject>/src/test/java 存在时由下方平台循环自动纳入扫描
        def activeJavaRoots = [new File(rootDir, 'src/main/java')]
        def versionsDir = new File(rootDir, 'versions')
        // P8 正名后平台目录名 = 注册表条目（实际版本号）；此处从注册表派生而非目录名模式匹配
        def platformDirs = versionRegistry.collect { new File(versionsDir, it.toString()) }.findAll { it.isDirectory() }
        assert platformDirs.size() == versionRegistry.size():
                "versions/ 下注册表平台目录缺失：registry=${versionRegistry}（目录存在性由 settings.gradle 双向断言兜底）"
        platformDirs.each { platformDir ->
            ['src/main/java', 'src/test/java'].each { sub ->
                def candidate = new File(platformDir, sub)
                if (candidate.isDirectory()) {
                    activeJavaRoots << candidate
                }
            }
        }
        def activeJavaFiles = []
        activeJavaRoots.each { root ->
            root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.java')) {
                    activeJavaFiles << f
                }
            }
        }

        def declaredNewSimples = mapping.keySet().collect { oldFqcn ->
            def newFqcn = mapping[oldFqcn]
            newFqcn.substring(newFqcn.lastIndexOf('.') + 1)
        }.collectEntries { simple -> [simple, []] }

        def commentMentions = [:].withDefault { [] }
        activeJavaFiles.each { f ->
            def text = f.getText('UTF-8')
            def segments = segmentJavaSource(text)
            mapping.each { oldFqcn, newFqcn ->
                def oldSimple = oldFqcn.substring(oldFqcn.lastIndexOf('.') + 1)
                def newSimple = newFqcn.substring(newFqcn.lastIndexOf('.') + 1)
                segments.each { segment ->
                    def kind = segment[0]
                    def segText = segment[1]
                    if (kind == 'code') {
                        if (segText =~ (/\b/ + java.util.regex.Pattern.quote(oldSimple) + /\b/)) {
                            throw new GradleException("active Java code 仍引用已改名类 ${oldSimple}: ${f}")
                        }
                        if (segText =~ (/\b(class|interface|enum|record)\s+/ + java.util.regex.Pattern.quote(oldSimple) + /\b/)) {
                            throw new GradleException("active Java 仍声明已改名类型 ${oldSimple}: ${f}")
                        }
                        if (segText =~ (/\b(class|interface|enum|record)\s+/ + java.util.regex.Pattern.quote(newSimple) + /\b/)) {
                            declaredNewSimples[newSimple] << f
                        }
                    } else if (kind == 'string' || kind == 'char' || kind == 'textBlock') {
                        if (segText =~ (/\b/ + java.util.regex.Pattern.quote(oldSimple) + /\b/)) {
                            throw new GradleException("active Java 字符串字面量仍引用已改名类 ${oldSimple}（功能性引用必须更新）: ${f}")
                        }
                    } else if (segText =~ (/\b/ + java.util.regex.Pattern.quote(oldSimple) + /\b/)) {
                        commentMentions[oldSimple] << f
                    }
                }
            }
        }
        mapping.each { oldFqcn, newFqcn ->
            def oldRelPath = oldFqcn.replace('.', '/') + '.java'
            def newRelPath = newFqcn.replace('.', '/') + '.java'
            assert !activeJavaRoots.any { root -> new File(root, oldRelPath).isFile() }:
                    "old 类源文件仍存在: ${oldRelPath}"
            assert activeJavaRoots.any { root -> new File(root, newRelPath).isFile() }:
                    "new 类源文件不存在于任何 active source root: ${newRelPath}"
            def newSimple = newFqcn.substring(newFqcn.lastIndexOf('.') + 1)
            assert !declaredNewSimples[newSimple].isEmpty():
                    "new 类 ${newSimple} 在 active Java 中没有类型声明"
        }

        def canonicalMixinRegistry = new groovy.json.JsonSlurper().parse(mixinRegistryFile)
        def canonicalMixinEntries = (canonicalMixinRegistry.entries ?: []).collect { it.name } as Set
        mapping.each { oldFqcn, _ ->
            def oldSimple = oldFqcn.substring(oldFqcn.lastIndexOf('.') + 1)
            assert !canonicalMixinEntries.contains(oldSimple):
                    "canonical Mixin registry still references renamed entry ${oldSimple}: ${mixinRegistryFile}"
        }

        // 功能性非 Java 文本（gradle / CI / 平台资源）：old 简名或 FQCN 必须不存在。
        // 排除：mapping 文件自身、构建输出 / .gradle / .git / gradle wrapper（含二进制）、
        // docs / references / README* / AGENTS.md / LICENSE / THIRD_PARTY_NOTICES.md（历史文档允许保留旧名）。
        def textScanNameExclusions = ['AGENTS.md', 'README.md', 'README_en.md', 'LICENSE',
                                      'THIRD_PARTY_NOTICES.md', 'gradlew', 'gradlew.bat']
        def textTargets = []
        ['build.gradle', 'settings.gradle', 'common.gradle', 'gradle.properties', 'settings.json'].each { name ->
            def f = new File(rootDir, name)
            if (f.isFile()) {
                textTargets << f
            }
        }
        def githubDir = new File(rootDir, '.github')
        if (githubDir.isDirectory()) {
            githubDir.eachFileRecurse(groovy.io.FileType.FILES) { textTargets << it }
        }
        // P10-A：common/ 纯资源档已退出，其文件迁入根 src/main/resources（仍由 rootDir 递归扫描覆盖）；
        // P10-B：versions/shared 已整体退出，其功能性文本扫描不再需要
        ([rootDir] + platformDirs).each { dir ->
            if (!dir.isDirectory()) {
                return
            }
            dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                def segments = rel.split('/')
                if (rel.endsWith('.java') || rel.endsWith('.mixins.json') || f == classRenameMappingFile ||
                        textScanNameExclusions.contains(f.name) ||
                        segments.any { (it.startsWith('.') && it != '.github') || it in ['build', 'gradle', 'docs', 'references'] } ||
                        f.length() > 4 * 1024 * 1024) {
                    return
                }
                textTargets << f
            }
        }
        textTargets.unique().each { f ->
            String text
            try {
                text = f.getText('UTF-8')
            } catch (IOException e) {
                println "警告：无法读取 ${f}（文件被占用或不可读），跳过该文件的 old 引用扫描"
                return
            }
            mapping.each { oldFqcn, _ ->
                def oldSimple = oldFqcn.substring(oldFqcn.lastIndexOf('.') + 1)
                def hit = text.contains(oldSimple)
                assert !hit: "功能性文本文件仍引用已改名类 ${oldSimple}: ${f}"
            }
        }

        commentMentions.each { simple, files ->
            if (!files.isEmpty()) {
                println "提示：${files.unique().size()} 个 active Java 文件的注释中保留旧名 ${simple} 的历史说明（允许，不阻断）"
            }
        }
        println "verifyClassRenameMapping OK（active Java / canonical Mixin registry / 功能性文本均无 old 引用）"
    }
}

// ==================== Phase 6（P6-1）：等价验证器自测 ====================
// 锁定等价验证的 fail-closed 语义：
//   - channel A：code 段整词类名改写生效（含 unchanged-FQCN class 仅引用 rename 的场景）；
//                字符串字面量 / 注释 / 前缀标识符 / 常量与指令语义差异必须失败；
//   - mapping 条目映射：class / sources 路径映射与内部类前缀传播；不相关条目保持不变；
//     per-platform bijective（映射碰撞检测）；mixin 配置 mapping 感知改写；
//   - channel B（探测可用时）：asm 规范化对干净 rename 通过、对字面量差异失败；
//     unchanged-FQCN class 仅引用 rename 通过（full-mapping remap），缺失 / 错误 mapping 失败；
//   - 普通资源：内容一致通过，内容变化必须被检测（排除项机制本身不豁免普通资源；
//     pack.mcmeta 不豁免——pack_format 相同、description 等其他内容变化必须失败）。
def selfTestRenameEquivalence = tasks.register('selfTestRenameEquivalence') {
    group = 'verification'
    description = 'Phase 6：class rename 等价验证器自测（fail-closed 语义回归）'
    doLast {
        def mapping = loadClassRenameMapping()
        println "selfTest: 当前 class rename mapping 共 ${mapping.size()} 条（语法与终态断言通过）"

        def testMapping = ['com.ice2974.carpeticeaddition.mixins.Old': 'com.ice2974.carpeticeaddition.mixins.New']
        assert mapClassEntryPath('com/ice2974/carpeticeaddition/mixins/Old.class', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/New.class'
        assert mapClassEntryPath('com/ice2974/carpeticeaddition/mixins/Old$1.class', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/New$1.class'
        assert mapClassEntryPath('com/ice2974/carpeticeaddition/mixins/OldOther.class', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/OldOther.class'
        assert mapClassEntryPath('com/ice2974/carpeticeaddition/mixins/Unrelated.class', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/Unrelated.class'
        assert mapSourceEntryPath('com/ice2974/carpeticeaddition/mixins/Old.java', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/New.java'
        assert mapSourceEntryPath('com/ice2974/carpeticeaddition/mixins/Unrelated.java', testMapping) ==
                'com/ice2974/carpeticeaddition/mixins/Unrelated.java'

        // mapping 条目集合对位：bijective 正例 + 映射碰撞负例
        def partners = computeClassEntryPartners([
                'com/ice2974/carpeticeaddition/mixins/Old.class',
                'com/ice2974/carpeticeaddition/mixins/Old$1.class',
                'com/ice2974/carpeticeaddition/mixins/Unrelated.class'], testMapping)
        assert !partners.collision: 'selfTest: 无碰撞 mapping 应用后必须保持一一对应'
        assert partners.expected == ([
                'com/ice2974/carpeticeaddition/mixins/New.class',
                'com/ice2974/carpeticeaddition/mixins/New$1.class',
                'com/ice2974/carpeticeaddition/mixins/Unrelated.class'] as Set)
        def collisionMapping = ['com.ice2974.carpeticeaddition.mixins.Old' : 'com.ice2974.carpeticeaddition.mixins.New',
                                'com.ice2974.carpeticeaddition.mixins.Twin': 'com.ice2974.carpeticeaddition.mixins.New']
        def collisionPartners = computeClassEntryPartners([
                'com/ice2974/carpeticeaddition/mixins/Old.class',
                'com/ice2974/carpeticeaddition/mixins/Twin.class'], collisionMapping)
        assert collisionPartners.collision: 'selfTest: 同平台映射碰撞必须被检测（fail closed）'

        // mixin 配置 mapping 感知改写：mapping 内条目改写、mapping 外条目与非数组键保持原样
        def testConfig = new groovy.json.JsonSlurper().parseText(
                '{"package":"com.ice2974.carpeticeaddition.mixins","mixins":["Old","Keep"],"client":["Keep"],"required":true}')
        def mappedConfig = mapMixinConfigEntries(testConfig, testMapping)
        assert mappedConfig.mixins == ['New', 'Keep']: 'selfTest: mixin 配置 mapping 内条目应被改写'
        assert mappedConfig.client == ['Keep']: 'selfTest: mixin 配置 mapping 外条目应保持原样'
        assert mappedConfig.required == true: 'selfTest: mixin 配置非数组键应保持原样'
        assert mapMixinConfigEntries(testConfig, [:]).mixins == ['Old', 'Keep']: 'selfTest: 空 mapping 不得改写配置'

        def renames = [[simpleOld: 'Old', simpleNew: 'New']]
        def oldSource = 'package p;\n' +
                '\n' +
                'import p.Old;\n' +
                '\n' +
                '/** comment mentions Old here */\n' +
                'class Old extends Base {\n' +
                '    String s = "text Old stays";\n' +
                "    char c = 'x';\n" +
                '    Object o = Old.class;\n' +
                '}\n'
        def cleanNewSource = 'package p;\n' +
                '\n' +
                'import p.New;\n' +
                '\n' +
                '/** comment mentions Old here */\n' +
                'class New extends Base {\n' +
                '    String s = "text Old stays";\n' +
                "    char c = 'x';\n" +
                '    Object o = New.class;\n' +
                '}\n'
        assert canonicalizeRenamedSource(oldSource, renames) == cleanNewSource:
                'selfTest: channel A 干净 rename 应通过'
        assert canonicalizeRenamedSource(oldSource, renames) !=
                cleanNewSource.replace('"text Old stays"', '"text New changed"'):
                'selfTest: channel A 字符串字面量差异必须失败（fail closed）'
        assert canonicalizeRenamedSource(oldSource, renames) !=
                cleanNewSource.replace('/** comment mentions Old here */', '/** comment mentions New here */'):
                'selfTest: channel A 注释差异必须失败（fail closed）'
        def prefixSource = oldSource.replace('Object o = Old.class;', 'Object o = OldPrefix.class;')
        def canonicalPrefix = canonicalizeRenamedSource(prefixSource, renames)
        assert canonicalPrefix.contains('OldPrefix') && !canonicalPrefix.contains('NewPrefix'):
                'selfTest: channel A 前缀标识符不得被整词替换波及'

        // unchanged-FQCN class（类名不变、仅内部引用了 renamed class）：mapping canonicalization 应放行
        def unchangedOldSource = 'package p;\n' +
                'class Holder {\n' +
                '    static final String TAG = "Old label";\n' +
                '    Class<?> c = Old.class;\n' +
                '    Object o = Old.CONST;\n' +
                '}\n'
        def unchangedNewSource = 'package p;\n' +
                'class Holder {\n' +
                '    static final String TAG = "Old label";\n' +
                '    Class<?> c = New.class;\n' +
                '    Object o = New.CONST;\n' +
                '}\n'
        assert canonicalizeRenamedSource(unchangedOldSource, renames) == unchangedNewSource:
                'selfTest: unchanged-FQCN class 仅 rename 引用变化应通过 channel A'
        assert canonicalizeRenamedSource(unchangedOldSource, renames) !=
                unchangedNewSource.replace('Object o = New.CONST;', 'Object o = New.OTHER;'):
                'selfTest: unchanged-FQCN class 的常量 / 指令语义变化必须失败（fail closed）'
        assert canonicalizeRenamedSource(unchangedOldSource, renames) !=
                unchangedNewSource.replace('"Old label"', '"New label"'):
                'selfTest: unchanged-FQCN class 的字符串字面量变化必须失败（fail closed）'

        // 普通资源：一致通过；内容变化必须被检测；排除项只对专项语义检查资源生效
        def baselineResources = ['a.json': '"v1"'.bytes, 'b.bin': [1, 2, 3] as byte[], 'fabric.mod.json': '"x"'.bytes]
        def sameResources = ['a.json': '"v1"'.bytes, 'b.bin': [1, 2, 3] as byte[], 'fabric.mod.json': '"changed"'.bytes]
        assert findDifferingOrdinaryResources(baselineResources, sameResources, isSpecialResourceEntry).isEmpty():
                'selfTest: 普通资源一致（专项语义检查资源变化不计入）应通过'
        def changedResources = ['a.json': '"v1"'.bytes, 'b.bin': [1, 2, 9] as byte[], 'fabric.mod.json': '"x"'.bytes]
        assert findDifferingOrdinaryResources(baselineResources, changedResources, isSpecialResourceEntry) == ['b.bin']:
                'selfTest: 普通资源内容变化必须被检测（fail closed）'

        // pack.mcmeta：pack_format 不变但 description 等其他内容变化必须被字节级比较捕获（P6-R6 修补的空洞）
        assert !isSpecialResourceEntry('resourcepacks/craftable_coral_blocks/pack.mcmeta'):
                'selfTest: pack.mcmeta 必须参与普通资源字节级比较（不得豁免）'
        def packMetaOriginal = '{"pack":{"pack_format":34,"description":"craftable coral blocks"}}'
        def packMetaSameFormatChangedDesc = '{"pack":{"pack_format":34,"description":"mutated"}}'
        assert findDifferingOrdinaryResources(
                ['resourcepacks/craftable_coral_blocks/pack.mcmeta': packMetaOriginal.bytes],
                ['resourcepacks/craftable_coral_blocks/pack.mcmeta': packMetaOriginal.bytes],
                isSpecialResourceEntry).isEmpty():
                'selfTest: pack.mcmeta 字节一致应通过'
        assert findDifferingOrdinaryResources(
                ['resourcepacks/craftable_coral_blocks/pack.mcmeta': packMetaOriginal.bytes],
                ['resourcepacks/craftable_coral_blocks/pack.mcmeta': packMetaSameFormatChangedDesc.bytes],
                isSpecialResourceEntry) == ['resourcepacks/craftable_coral_blocks/pack.mcmeta']:
                'selfTest: pack.mcmeta 非 pack_format 内容变化必须失败（fail closed）'

        // P10-R1b：readEntries 只收集实际文件条目（ZIP directory entry 不参与等价集合）——
        // 过滤正例（含 fixture 自证）+ 双向仅目录差异等价 + 实际文件缺失 / 新增保持可区分（fail closed）
        def zipFixtureDir = java.nio.file.Files.createTempDirectory('carpet-ice-addition-selftest').toFile()
        try {
            def writeZip = { File file, List entries ->
                new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(file)).withCloseable { zip ->
                    entries.each { name, bytes ->
                        zip.putNextEntry(new java.util.zip.ZipEntry(name))
                        if (bytes != null) {
                            zip.write(bytes)
                        }
                        zip.closeEntry()
                    }
                }
            }
            def withDir = new File(zipFixtureDir, 'with-dir.jar')
            writeZip(withDir, [
                    ['data/', null],
                    ['data/carpet-ice-addition/', null],
                    ['com/ice2974/X.java', 'class X {}'.bytes],
                    ['fabric.mod.json', '{}'.bytes]])
            def rawNames = new java.util.zip.ZipFile(withDir).withCloseable { zip ->
                zip.entries().collect { it.name } as Set
            }
            assert rawNames.containsAll(['data/', 'data/carpet-ice-addition/']):
                    'selfTest: fixture 必须真实包含 directory entry（防 fixture 失效空转）'
            assert readEntries(withDir) == (['com/ice2974/X.java', 'fabric.mod.json'] as Set):
                    'selfTest: readEntries 必须过滤 directory entry 且保留实际文件条目'

            def fileOnly = new File(zipFixtureDir, 'file-only.jar')
            writeZip(fileOnly, [['com/ice2974/X.java', 'class X {}'.bytes]])
            def baselineHasDir = new File(zipFixtureDir, 'baseline-has-dir.jar')
            writeZip(baselineHasDir, [['data/', null], ['com/ice2974/X.java', 'class X {}'.bytes]])
            def currentHasDir = new File(zipFixtureDir, 'current-has-dir.jar')
            writeZip(currentHasDir, [['com/ice2974/X.java', 'class X {}'.bytes], ['data/', null]])
            assert readEntries(baselineHasDir) == readEntries(fileOnly):
                    'selfTest: 仅 directory entry 差异（baseline 有 / current 无）必须等价'
            assert readEntries(currentHasDir) == readEntries(fileOnly):
                    'selfTest: 仅 directory entry 差异（baseline 无 / current 有）必须等价'

            def withExtraFile = new File(zipFixtureDir, 'with-extra-file.jar')
            writeZip(withExtraFile, [['com/ice2974/X.java', 'class X {}'.bytes], ['g.txt', 'g'.bytes]])
            assert readEntries(withExtraFile) != readEntries(fileOnly):
                    'selfTest: 实际文件新增必须与基线可区分（fail closed）'
            assert readEntries(fileOnly) != readEntries(withExtraFile):
                    'selfTest: 实际文件缺失必须与基线可区分（fail closed）'
        } finally {
            zipFixtureDir.deleteDir()
        }

        def asm = probeAsmSupport()
        if (asm == null) {
            println 'selfTest: channel B 探测不可用（构建环境无既有 asm），跳过 classfile 自测'
        } else {
            def canonicalizer = loadAsmCanonicalizer(asm.pkg, asm.loader)
            // 行号故意不同：模拟 consolidation 引入门控注释行导致的 LineNumberTable 漂移（P6-5 场景）
            def oldClass = canonicalizer.buildSample('p/Old', 'Old.java', 'hello world', 42)
            def newClass = canonicalizer.buildSample('p/New', 'New.java', 'hello world', 99)
            def renameEntries = buildInternalRenameEntries(['p.Old': 'p.New'])
            assert java.util.Arrays.equals(
                    canonicalizer.canonicalize(oldClass, renameEntries),
                    canonicalizer.canonicalize(newClass, [])):
                    'selfTest: channel B 干净 rename 应通过'
            def literalMutated = canonicalizer.buildSample('p/New', 'New.java', 'hello mutated', 99)
            assert !java.util.Arrays.equals(
                    canonicalizer.canonicalize(oldClass, renameEntries),
                    canonicalizer.canonicalize(literalMutated, [])):
                    'selfTest: channel B 字符串字面量差异必须失败（fail closed）'

            // unchanged-FQCN class 仅内部引用 renamed class：full-mapping remap 后应等价
            def refOld = canonicalizer.buildRefSample('p/Holder', 'Holder.java', 'p/Old', 42)
            def refNew = canonicalizer.buildRefSample('p/Holder', 'Holder.java', 'p/New', 42)
            assert java.util.Arrays.equals(
                    canonicalizer.canonicalize(refOld, renameEntries),
                    canonicalizer.canonicalize(refNew, [])):
                    'selfTest: channel B unchanged-FQCN 仅引用 rename 应通过'
            assert !java.util.Arrays.equals(
                    canonicalizer.canonicalize(refOld, []),
                    canonicalizer.canonicalize(refNew, [])):
                    'selfTest: channel B 缺失 mapping 引用时必须失败（fail closed）'
            assert !java.util.Arrays.equals(
                    canonicalizer.canonicalize(refOld, buildInternalRenameEntries(['p.Old': 'p.Other'])),
                    canonicalizer.canonicalize(refNew, [])):
                    'selfTest: channel B 错误映射目的地必须失败（fail closed）'
            // $ 内部类前缀传播：Holder$1 引用 Old$2 → New$2
            def innerOld = canonicalizer.buildRefSample('p/Holder$1', 'Holder.java', 'p/Old$2', 42)
            def innerNew = canonicalizer.buildRefSample('p/Holder$1', 'Holder.java', 'p/New$2', 42)
            assert java.util.Arrays.equals(
                    canonicalizer.canonicalize(innerOld, renameEntries),
                    canonicalizer.canonicalize(innerNew, [])):
                    'selfTest: channel B $ 内部类前缀传播应通过'

            // ---- P9 ownership-transfer 证明语义自测（两层模型 fail-closed 回归，7 例）----
            // 用例 1 前置：Layer 2 成员推导必须纳入 X.class 与 X$*.class（nested/synthetic）且不纳入无关条目
            def ownerEntriesLayer2 = ownershipTransferredEntriesForOwner('com.ice2974.carpeticeaddition.rules.MockOwner', [
                    'com/ice2974/carpeticeaddition/rules/MockOwner.class',
                    'com/ice2974/carpeticeaddition/rules/MockOwner$MachineRecord.class',
                    'com/ice2974/carpeticeaddition/rules/MockOwner$1.class',
                    'com/ice2974/carpeticeaddition/rules/Unrelated.class'] as Set)
            assert ownerEntriesLayer2 == ([
                    'com/ice2974/carpeticeaddition/rules/MockOwner.class',
                    'com/ice2974/carpeticeaddition/rules/MockOwner$MachineRecord.class',
                    'com/ice2974/carpeticeaddition/rules/MockOwner$1.class'] as Set):
                    'selfTest: Layer 2 必须纳入 X.class 与 X$*.class（nested/synthetic）且不纳入无关条目'
            // 用例 1：ownership transfer + nested $ + 仅合法 version 差异 → PASS（byte-identical 与 scoped channel B 双路径）
            def mockOwnerInternal = 'com/ice2974/carpeticeaddition/rules/MockOwner$MachineRecord'
            def transferredOld65 = withClassfileMajor(
                    canonicalizer.buildSample(mockOwnerInternal, 'MockOwner.java', 'rec', 42), 65)
            def transferredNew69 = withClassfileMajor(
                    canonicalizer.buildSample(mockOwnerInternal, 'MockOwner.java', 'rec', 7), 69)
            def proof1a = proveTransferredEntry(transferredOld65, transferredOld65, 65, [:])
            assert proof1a.ok && proof1a.mode == 'byte-identical':
                    'selfTest: transferred byte-identical 应通过'
            def proof1b = proveTransferredEntry(transferredOld65, transferredNew69, 69, [:])
            assert proof1b.ok && proof1b.mode == 'channelB':
                    "selfTest: transferred 65→69 仅合法 major 差异应通过 scoped channel B（${proof1b.reason}）"
            // 用例 2：非 ownership class 仅 version 不同 → 严格 channel B 必须 FAIL
            def plainOld65 = withClassfileMajor(canonicalizer.buildSample('p/Plain', 'Plain.java', 'same', 42), 65)
            def plainNew69 = withClassfileMajor(canonicalizer.buildSample('p/Plain', 'Plain.java', 'same', 42), 69)
            assert channelBEquivalence(plainOld65, plainNew69, [:]) != null:
                    'selfTest: 非 ownership class 仅 version 差异必须失败（fail closed）'
            // 用例 3：transferred current major 与 java_release 不符 → FAIL
            def proof3 = proveTransferredEntry(transferredOld65, withClassfileMajor(
                    canonicalizer.buildSample(mockOwnerInternal, 'MockOwner.java', 'rec', 7), 65), 69, [:])
            assert !proof3.ok && proof3.reason.contains('major'):
                    "selfTest: transferred current major 与 java_release 不符必须失败（${proof3.reason}）"
            // 用例 4：transferred literal/指令差异 → FAIL
            def proof4 = proveTransferredEntry(transferredOld65, withClassfileMajor(
                    canonicalizer.buildSample(mockOwnerInternal, 'MockOwner.java', 'mutated', 7), 69), 69, [:])
            assert !proof4.ok:
                    "selfTest: transferred literal/指令差异必须失败（fail closed，${proof4.reason}）"
            // 用例 5：非 ownership nested $ class version 不同 → 严格 channel B 必须 FAIL
            def plainInnerOld65 = withClassfileMajor(canonicalizer.buildSample('p/Plain$1', 'Plain.java', 'same', 42), 65)
            def plainInnerNew69 = withClassfileMajor(canonicalizer.buildSample('p/Plain$1', 'Plain.java', 'same', 42), 69)
            assert channelBEquivalence(plainInnerOld65, plainInnerNew69, [:]) != null:
                    'selfTest: 非 ownership nested $ class 仅 version 差异必须失败（fail closed）'
            // 用例 6：transferred lambda 合成方法名序号差异（javac 21 类全局 → 25 按方法计数的产物，
            // VanillaLanguageService 实测场景）→ scoped 规范化应通过
            def lambdaOld = withClassfileMajor(
                    canonicalizer.buildNamedMethodSample('p/T', 'T.java', 'lambda$start$1', 'v', 42), 65)
            def lambdaNew = withClassfileMajor(
                    canonicalizer.buildNamedMethodSample('p/T', 'T.java', 'lambda$start$0', 'v', 7), 69)
            def proof6 = proveTransferredEntry(lambdaOld, lambdaNew, 69, [:])
            assert proof6.ok && proof6.mode == 'channelB':
                    "selfTest: transferred lambda 序号差异应通过 scoped 规范化（${proof6.reason}）"
            // 用例 7：同一 lambda 序号差异落在非 ownership class 上 → 严格 channel B 必须 FAIL
            assert channelBEquivalence(lambdaOld, lambdaNew, [:]) != null:
                    'selfTest: 非 ownership class lambda 序号差异必须失败（fail closed，严格路径无 lambda 规范化）'
            println 'selfTest: P9 ownership-transfer 证明语义 7 例自测通过'
            println "selfTest: channel B classfile 自测通过（asm=${asm.pkg}）"
        }
        println 'selfTestRenameEquivalence OK'
    }
}

gradle.projectsEvaluated {
    // P9 起 :common 子项目已删除，根直接子项目恰为版本注册表项目（与 settings.gradle include 一致）
    def includedVersionProjects = gradle.rootProject.allprojects.findAll { it.parent == gradle.rootProject }
    assert platformProjects.toSorted() == includedVersionProjects*.path.toSorted():
            "versionProjects（${platformProjects.toSorted()}）必须与 settings.gradle include 的版本子项目（${includedVersionProjects*.path.toSorted()}）保持一致"

    platformProjects.each { projectPath ->
        def platform = project(projectPath)
        def jarTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar')
        def sourcesJarTask = platform.tasks.findByName('remapSourcesJar') ?: platform.tasks.named('sourcesJar')
        verifyCraftableCoralBlocksJars.configure { dependsOn jarTask }
        verifyFabricModJson.configure { dependsOn jarTask }
        verifyMixinConfigs.configure { dependsOn jarTask; dependsOn sourcesJarTask }
        verifyJarEquivalence.configure { dependsOn jarTask }
    }
}
