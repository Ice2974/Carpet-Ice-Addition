plugins {
    // Phase 5（P5-1）：根项目承载 preprocess 版本图（根无 parent → 自动应用 RootPreprocessPlugin）。
    // 插件 id 沿用 ReplayMod 上游命名，经 settings.gradle resolutionStrategy 解析到
    // JitPack com.github.Fallen-Breath:preprocessor（版本 = 根 gradle.properties preprocess_version，全 SHA 锁定）。
    id 'com.replaymod.preprocess' version "${preprocess_version}"
}

// preprocess 版本图（Phase 5）：节点名 = 真实 Gradle project name（扁平化后 :platform-mcXXXX），
// 版本码整数与节点一一对应；主版本（core = versions/mainProject 文件内容 platform-mc12111，
// 即 root src 的命名基准）无变换直通，其余节点沿链变换。
// 边约定：link(高版本侧, 低版本侧, file)，mapping 文件内容 = 高版本侧命名 → 低版本侧命名（AMS 同款约定）；
// 1.21.x remap↔remap 边依赖插件经 loom mappings 的 automatic mapping（named→intermediary→named 自动合成，
// P5-0 实证的纯 rename 不写条目，文件保持 0 字节）；platform-mc12111↔platform-mc261 为 remap↔plain 边
// （26.x 无 intermediary，自动链路不存在），显式 legacy mapping 承载 rename（P5-4 按机械提取填充，当前 0 字节占位）。
preprocess {
    strictExtraMappings.set(true)

    def mc12101  = createNode('platform-mc1211', 1_21_01, '')
    def mc12103  = createNode('platform-mc1213', 1_21_03, '')
    def mc12104  = createNode('platform-mc1214', 1_21_04, '')
    def mc12105  = createNode('platform-mc1215', 1_21_05, '')
    def mc12106  = createNode('platform-mc1216', 1_21_06, '')
    def mc12108  = createNode('platform-mc1218', 1_21_08, '')
    def mc12109  = createNode('platform-mc1219', 1_21_09, '')
    def mc12110  = createNode('platform-mc12110', 1_21_10, '')
    def mc12111  = createNode('platform-mc12111', 1_21_11, '')
    def mc260102 = createNode('platform-mc261', 26_01_02, '')
    def mc260200 = createNode('platform-mc262', 26_02_00, '')

    mc12103.link(mc12101, file('versions/mapping-mc1213-mc1211.txt'))
    mc12104.link(mc12103, file('versions/mapping-mc1214-mc1213.txt'))
    mc12105.link(mc12104, file('versions/mapping-mc1215-mc1214.txt'))
    mc12106.link(mc12105, file('versions/mapping-mc1216-mc1215.txt'))
    mc12108.link(mc12106, file('versions/mapping-mc1218-mc1216.txt'))
    mc12109.link(mc12108, file('versions/mapping-mc1219-mc1218.txt'))
    mc12110.link(mc12109, file('versions/mapping-mc12110-mc1219.txt'))
    mc12111.link(mc12110, file('versions/mapping-mc12111-mc12110.txt'))
    mc12111.link(mc260102, file('versions/mapping-mc12111-mc261.txt'))
    mc260200.link(mc260102, file('versions/mapping-mc262-mc261.txt'))
}

allprojects {
    group = project.maven_group
    version = project.mod_version

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://masa.dy.fi/maven' }
        maven {
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }
}

// 平台清单来自版本注册表 settings.json（与 settings.gradle 同一数据源，消除双源漂移）
def versionRegistry = new groovy.json.JsonSlurper().parse(file('settings.json')).versions as List<String>
def platformProjects = versionRegistry.collect { version -> ":platform-${version}" }

def craftableCoralRecipePaths = [
        'coral_block_from_tube_coral_fan',
        'coral_block_from_brain_coral_fan',
        'coral_block_from_bubble_coral_fan',
        'coral_block_from_fire_coral_fan',
        'coral_block_from_horn_coral_fan',
        'coral_block_from_dead_tube_coral_fan',
        'coral_block_from_dead_brain_coral_fan',
        'coral_block_from_dead_bubble_coral_fan',
        'coral_block_from_dead_fire_coral_fan',
        'coral_block_from_dead_horn_coral_fan'
]

def verifyCraftableCoralBlocksJars = tasks.register('verifyCraftableCoralBlocksJars') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name }
            }
            def packRoot = 'resourcepacks/craftable_coral_blocks/'
            def packMeta = "${packRoot}pack.mcmeta"
            def recipeRoot = "${packRoot}data/carpet-ice-addition/recipe/"
            def expectedRecipes = craftableCoralRecipePaths.collect { path -> "${recipeRoot}${path}.json".toString() }

            assert entries.count { name -> name == packMeta } == 1: "Expected one ${packMeta} in ${jarFile.name}"
            assert entries.containsAll(expectedRecipes): "Missing coral recipe in ${jarFile.name}"
            assert entries.findAll { name -> name.startsWith(recipeRoot) && name.endsWith('.json') }.sort() == expectedRecipes.sort():
                    "Unexpected coral recipes in ${jarFile.name}"
            assert entries.every { name -> !name.startsWith('data/carpet-ice-addition/recipe/coral_block_') }:
                    "Legacy main datapack coral recipe remains in ${jarFile.name}"

            def meta = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry(packMeta)
                new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
            }
            // 期望 pack_format 来自各平台 per-version gradle.properties 的 pack_format 键（原硬编码映射的数据化搬移）
            assert meta.pack.pack_format == platform.pack_format.toInteger():
                    "Unexpected pack_format in ${jarFile.name}: ${meta.pack.pack_format}"
        }
    }
}

def verifyFabricModJson = tasks.register('verifyFabricModJson') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing remapped JAR for ${projectPath}: ${jarFile}"

            def bytes = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("fabric.mod.json entry not found in ${jarFile.name} (${projectPath})")
                }
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) starts with a UTF-8 BOM")
            }
            def text = new String(bytes, java.nio.charset.StandardCharsets.UTF_8)
            try {
                new groovy.json.JsonSlurper().parseText(text)
            } catch (Exception e) {
                throw new GradleException("fabric.mod.json in ${jarFile.name} (${projectPath}) is not valid JSON: ${e.message}", e)
            }
            if (text.contains('${')) {
                throw new GradleException("Unexpanded template placeholder in fabric.mod.json of ${jarFile.name} (${projectPath})")
            }

            // 项目级一致性防线（Phase 2 新增），锚定 per-version 数据键：
            // 1) fabric.mod.json 的 mixins 引用恰为登记的 mixin_config；
            // 2) 该 mixin 配置文件实际存在于 jar；
            // 3) depends.fabricloader == ">=loader_version"。第 3 条是本项目当前数据模型的
            //    项目级 invariant（模板硬编码值与 per-version loader_version 恒等），
            //    不是 Fabric Loader 的通用必然关系；未来若某平台最低运行依赖需与构建
            //    loader 版本分离，应先调整 per-version 数据模型，再同步放宽此断言。
            def fabricModJson = new groovy.json.JsonSlurper().parseText(text)
            def mixinConfigName = platform.mixin_config
            assert fabricModJson.mixins == [mixinConfigName]:
                    "fabric.mod.json mixins ${fabricModJson.mixins} != [${mixinConfigName}] in ${jarFile.name} (${projectPath})"
            def mixinConfigInJar = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.getEntry(mixinConfigName) != null
            }
            assert mixinConfigInJar: "mixin config ${mixinConfigName} not found in ${jarFile.name} (${projectPath})"
            def expectedLoaderDependency = ">=${platform.loader_version}"
            assert fabricModJson.depends.fabricloader == expectedLoaderDependency:
                    "fabric.mod.json fabricloader ${fabricModJson.depends.fabricloader} != ${expectedLoaderDependency} in ${jarFile.name} (${projectPath})"
        }
    }
}

// mixin 配置一致性防线（P3-3）：11 份平台 mixin json 保留现状（不合并、不模板生成、不改内容），
// 逐平台校验 json 与编译产物 / 合并源码集的双向一致性，防止源码重构引起条目漂移（验收清单 §3.5）：
//   1) per-version mixin_config 声明的 json 在 src/main/resources 与 jar 内均存在且 JSON 合法；
//   2) mixins + client 数组每个条目在 jar 内存在对应类条目（防悬空）；
//   3) 平台合并源码集 mixins 包的全部类恰为条目并集（防漏注；mixins 包语义上只允许注册进 json 的 mixin 类）；
//   4) package / required / compatibilityLevel（对照 per-version java_release）/ injectors.defaultRequire 项目级不变量。
def verifyMixinConfigs = tasks.register('verifyMixinConfigs') {
    doLast {
        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def jarFile = outputTask.archiveFile.get().asFile
            assert jarFile.isFile(): "Missing release JAR for ${projectPath}: ${jarFile}"

            def mixinConfigName = platform.mixin_config
            def configLabel = "${jarFile.name} (${projectPath})"

            def sourceConfigFile = new File(platform.projectDir, "src/main/resources/${mixinConfigName}")
            assert sourceConfigFile.isFile(): "mixin config source not found for ${projectPath}: ${sourceConfigFile}"

            def readEntryBytes = { String entryName ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    def entry = zip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("Entry ${entryName} not found in ${jarFile.name}")
                    }
                    zip.getInputStream(entry).readAllBytes()
                }
            }
            assert readEntryBytes(mixinConfigName) != null: "mixin config ${mixinConfigName} not packaged in ${configLabel}"

            def config = new groovy.json.JsonSlurper().parseText(
                    new String(readEntryBytes(mixinConfigName), java.nio.charset.StandardCharsets.UTF_8))

            def mixinsList = (config.mixins ?: []) as List<String>
            def clientList = (config.client ?: []) as List<String>
            def allEntries = mixinsList + clientList

            assert config.package == 'com.ice2974.carpeticeaddition.mixins':
                    "Unexpected mixin package ${config.package} in ${configLabel}"
            assert config.required == true:
                    "mixin config required=${config.required} in ${configLabel} (AGENTS.md: 平台 mixins 默认 required=true)"
            assert config.compatibilityLevel == "JAVA_${platform.java_release}":
                    "compatibilityLevel ${config.compatibilityLevel} != JAVA_${platform.java_release} in ${configLabel}"
            assert config.injectors != null && config.injectors.defaultRequire == 1:
                    "injectors.defaultRequire=${config.injectors?.defaultRequire} in ${configLabel}"
            assert allEntries.size() == allEntries.toSet().size():
                    "duplicate mixin entries in ${configLabel}"
            assert (mixinsList as Set).intersect(clientList as Set).isEmpty():
                    "entries listed in both mixins and client arrays in ${configLabel}"

            def jarEntries = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().collect { entry -> entry.name } as Set<String>
            }
            def dangling = allEntries.findAll { name ->
                !jarEntries.contains("com/ice2974/carpeticeaddition/mixins/${name}.class".toString())
            }
            assert dangling.isEmpty(): "dangling mixin entries (no class in jar) in ${configLabel}: ${dangling.sort()}"

            def mixinPkgPath = 'com/ice2974/carpeticeaddition/mixins'
            def sourceMixinClasses = platform.sourceSets.main.java.srcDirs.collectMany { srcDir ->
                def pkgDir = new File(srcDir, mixinPkgPath)
                if (pkgDir.isDirectory()) {
                    pkgDir.listFiles({ File dir, String name -> name.endsWith('.java') } as FilenameFilter)
                            .collect { it.name - '.java' }
                } else {
                    []
                }
            } as Set
            def unlisted = sourceMixinClasses.findAll { name -> !allEntries.contains(name) }
            assert unlisted.isEmpty(): "mixin classes in source set but missing from ${mixinConfigName} in ${configLabel}: ${unlisted.sort()}"
            assert (allEntries as Set) == sourceMixinClasses:
                    "mixin entry set != source mixin class set in ${configLabel}"

            println "mixin config OK: ${configLabel} (${mixinsList.size()} mixins + ${clientList.size()} client == ${sourceMixinClasses.size()} source classes)"
        }
    }
}

// L1-6 jar 内容级等价对照（Phase 2）：与迁移前全量构建快照逐平台比对。
// 用法：.\gradlew.bat verifyJarEquivalence -PbaselineDir=<快照根目录>（含 versions/platform-*/build/libs 的目录，建议绝对路径）
// 比对项：zip 条目清单、fabric.mod.json 解析后逐键语义、全部 *.mixins.json 字节、pack.mcmeta 的 pack_format、
// 以及本模组全部 class 的 intermediary 引用集合（P4-1 新增，Phase 4 命名空间迁移语义防线，见任务内注释）；
// 另核对两侧 sources jar 存在且同名。class 文件不做字节级比对（编译时间戳噪声，见 refactor-target-architecture R5）。
def verifyJarEquivalence = tasks.register('verifyJarEquivalence') {
    doLast {
        def baselineDirName = project.findProperty('baselineDir')
        if (baselineDirName == null) {
            throw new GradleException('缺少 -PbaselineDir=<迁移前全量构建快照根目录>（指向含 versions/platform-*/build/libs 的目录，建议绝对路径）')
        }
        def baselineRoot = rootProject.file(baselineDirName)

        platformProjects.each { projectPath ->
            def platform = project(projectPath)
            def outputTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar').get()
            def currentJar = outputTask.archiveFile.get().asFile
            assert currentJar.isFile(): "Missing release JAR for ${projectPath}: ${currentJar}"

            def platformCode = platform.name.substring('platform-'.length())
            def baselineJar = new File(baselineRoot, "versions/platform-${platformCode}/build/libs/${currentJar.name}")
            assert baselineJar.isFile(): "Baseline JAR not found for ${projectPath}: ${baselineJar}"

            def sourcesName = { String jarName -> "${jarName.substring(0, jarName.length() - 4)}-sources.jar" }
            assert new File(currentJar.parentFile, sourcesName(currentJar.name)).isFile():
                    "Missing current sources JAR for ${projectPath}"
            assert new File(baselineJar.parentFile, sourcesName(baselineJar.name)).isFile():
                    "Baseline sources JAR not found for ${projectPath}"

            def readEntries = { File jarFile ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    zip.entries().collect { entry -> entry.name } as Set<String>
                }
            }
            def currentEntries = readEntries(currentJar)
            def baselineEntries = readEntries(baselineJar)
            def missingEntries = (baselineEntries - currentEntries).sort()
            def extraEntries = (currentEntries - baselineEntries).sort()
            if (missingEntries || extraEntries) {
                throw new GradleException("Zip entry mismatch for ${currentJar.name} vs ${baselineJar.name}:\n" +
                        "  missing in current: ${missingEntries}\n  extra in current: ${extraEntries}")
            }

            def readEntryBytes = { File jarFile, String entryName ->
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    def entry = zip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("Entry ${entryName} not found in ${jarFile.name}")
                    }
                    zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                }
            }
            def readEntryText = { File jarFile, String entryName ->
                new String(readEntryBytes(jarFile, entryName), java.nio.charset.StandardCharsets.UTF_8)
            }

            // fabric.mod.json：模板展开值应完全相同，解析后逐键语义一致
            def slurper = new groovy.json.JsonSlurper()
            def currentModJson = slurper.parseText(readEntryText(currentJar, 'fabric.mod.json'))
            def baselineModJson = slurper.parseText(readEntryText(baselineJar, 'fabric.mod.json'))
            assert currentModJson == baselineModJson:
                    "fabric.mod.json semantic mismatch for ${currentJar.name} vs ${baselineJar.name}"

            // 全部 mixin 配置文件逐字节一致（其内容不参与模板展开）
            currentEntries.findAll { it.endsWith('.mixins.json') }.sort().each { entryName ->
                assert java.util.Arrays.equals(readEntryBytes(currentJar, entryName), readEntryBytes(baselineJar, entryName)):
                        "mixin config ${entryName} differs between ${currentJar.name} and ${baselineJar.name}"
            }

            // 珊瑚资源包 pack.mcmeta 的 pack_format 逐平台一致
            def packMetaPath = 'resourcepacks/craftable_coral_blocks/pack.mcmeta'
            def currentPackFormat = slurper.parseText(readEntryText(currentJar, packMetaPath)).pack.pack_format
            def baselinePackFormat = slurper.parseText(readEntryText(baselineJar, packMetaPath)).pack.pack_format
            assert currentPackFormat == baselinePackFormat:
                    "pack_format mismatch for ${currentJar.name}: current=${currentPackFormat} baseline=${baselinePackFormat}"

            // P4-1 intermediary 引用集合语义比较（Phase 4 命名空间迁移等价防线）。
            // 实证记录：本项目 loom 构建不产出 refmap（注解目标在 remapJar 时直接重映射进 class 常量池，
            // mixin json 无 refmap 指针），因此 Yarn→Mojmap 迁移的语义验证对象是 class 文件内的
            // (class|method|field)_NNNN intermediary 引用集合：同名 class 在两侧 jar 中集合必须完全一致。
            // 覆盖 mixin 注解目标（@Mixin/@Inject/@At/@Shadow/@Accessor 字符串）与全部编译期 MC 成员调用；
            // 检出案例：BeaconBlockEntityMixin 的 @At target 在自动迁移中未被重映射（getOpacity→getLightBlock），
            // 该差异在本比较下必现，杜绝 blanket 忽略。
            def intermediaryPattern = ~/(?:class|method|field)_[0-9]+/
            def readIntermediaryRefs = { File jarFile, Collection<String> entryNames ->
                def result = [:]
                new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                    entryNames.each { entryName ->
                        def bytes = zip.getInputStream(zip.getEntry(entryName)).withCloseable { it.readAllBytes() }
                        def matcher = intermediaryPattern.matcher(new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1))
                        def refs = new TreeSet<String>()
                        while (matcher.find()) {
                            refs << matcher.group()
                        }
                        result[entryName] = refs
                    }
                }
                result
            }
            def ourClassEntries = currentEntries.findAll { it.startsWith('com/ice2974/') && it.endsWith('.class') } as Set
            def currentRefs = readIntermediaryRefs(currentJar, ourClassEntries)
            def baselineRefs = readIntermediaryRefs(baselineJar, ourClassEntries)
            ourClassEntries.sort().each { entryName ->
                assert currentRefs[entryName] == baselineRefs[entryName]:
                        "intermediary reference set differs for ${entryName} in ${currentJar.name} vs ${baselineJar.name}:\n" +
                        "  only in current: ${(currentRefs[entryName] - baselineRefs[entryName]).sort()}\n" +
                        "  only in baseline: ${(baselineRefs[entryName] - currentRefs[entryName]).sort()}"
            }
            println "intermediary refs OK: ${ourClassEntries.size()} classes (${currentJar.name})"

            println "L1-6 equivalence OK: ${currentJar.name}"
        }
    }
}

gradle.projectsEvaluated {
    assert platformProjects.toSorted() == gradle.rootProject.allprojects.findAll { it.path.startsWith(':platform-') }*.path.toSorted():
            'platformProjects must stay in sync with the :platform-* projects included by settings.gradle'

    platformProjects.each { projectPath ->
        def platform = project(projectPath)
        def jarTask = platform.tasks.findByName('remapJar') ?: platform.tasks.named('jar')
        verifyCraftableCoralBlocksJars.configure { dependsOn jarTask }
        verifyFabricModJson.configure { dependsOn jarTask }
        verifyMixinConfigs.configure { dependsOn jarTask }
        verifyJarEquivalence.configure { dependsOn jarTask }
    }
}
